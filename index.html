<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1626">
<meta name="author" content="روّاد">
<title>منصّة المجلس</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>document.documentElement.dir='rtl';document.documentElement.lang='ar';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: dark navy rail (sidebar on desktop, bottom tabs on phones) beside an ivory working surface; gold marks the council, four fixed hues mark the companies. */
  --head:#0B1626; --ink:#0B1626; --ink2:#13233A; --navy:#1B2F4B;
  --bg:#F6F2EA; --surface:#FFFFFF; --surface2:#FBF8F2; --line:#E7DECD; --line2:#F0EADF;
  --gold:#B8925A; --gold2:#D9BC84; --gold3:#8A6A3B;
  --text:#1D2633; --text2:#4A5463; --muted:#7A8392;
  /* categorical — fixed order, validated (light) */
  --c-clinic:#1F5FA8; --c-factory:#C08A2E; --c-law:#8E4BB0; --c-edu:#119C84; --c-exp:#B9C1CC;
  --grid:#EFE8DA; --axis:#CFC5B3; --hover:#FCFAF5; --scrim:rgba(8,17,30,.5); --cur:#F6EDD9;
  /* status — reserved */
  --good:#2F7D4F; --good-bg:#E3F1E8; --warn:#9A6A12; --warn-bg:#FBEFD6; --crit:#B23A2E; --crit-bg:#F8E2DF; --idle:#5B6574; --idle-bg:#ECEFF3; --info:#2D5B9A; --info-bg:#E5ECF6;
  --r:14px; --shadow:0 1px 2px rgba(11,22,38,.04),0 8px 24px rgba(11,22,38,.05);
  --display:"Amiri",Georgia,serif; --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --head:#F1E9DA; --bg:#0A111C; --surface:#121B29; --surface2:#172234; --line:#263449; --line2:#1C2838;
  --gold:#C9A465; --gold3:#D9BC84; --text:#E6E1D7; --text2:#B9C1CD; --muted:#8D97A6;
  --c-clinic:#5B8FD6; --c-factory:#B98222; --c-law:#A779CC; --c-edu:#14967E; --c-exp:#4A5668;
  --grid:#1E2A3B; --axis:#33435A; --hover:#162131; --scrim:rgba(0,0,0,.6); --cur:#2A2617;
  --good:#7CCB98; --good-bg:#16301F; --warn:#E3B45A; --warn-bg:#33270F; --crit:#F08A7E; --crit-bg:#3A1A17; --idle:#A9B3C1; --idle-bg:#222D3C; --info:#8DB4EA; --info-bg:#172A45;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --head:#F1E9DA; --bg:#0A111C; --surface:#121B29; --surface2:#172234; --line:#263449; --line2:#1C2838;
  --gold:#C9A465; --gold3:#D9BC84; --text:#E6E1D7; --text2:#B9C1CD; --muted:#8D97A6;
  --c-clinic:#5B8FD6; --c-factory:#B98222; --c-law:#A779CC; --c-edu:#14967E; --c-exp:#4A5668;
  --grid:#1E2A3B; --axis:#33435A; --hover:#162131; --scrim:rgba(0,0,0,.6); --cur:#2A2617;
  --good:#7CCB98; --good-bg:#16301F; --warn:#E3B45A; --warn-bg:#33270F; --crit:#F08A7E; --crit-bg:#3A1A17; --idle:#A9B3C1; --idle-bg:#222D3C; --info:#8DB4EA; --info-bg:#172A45;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
.serif{font-family:var(--display)}
a{color:inherit;text-decoration:none}

/* layout */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:radial-gradient(140% 80% at 50% 0%,#18304F 0%,var(--ink) 65%);color:#E9E2D3;padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;border-bottom:1px solid rgba(217,188,132,.18)}
.brand b{font-family:var(--display);font-size:21px;color:var(--gold2);display:block;line-height:1.2}
.brand span{font-size:11.5px;color:#9AA6B8}
nav{margin-top:18px;display:flex;flex-direction:column;gap:2px}
nav .grp{font-size:11px;color:#7F8CA0;margin:16px 10px 6px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:#CBD3DF;font-size:14px}
nav a:hover{background:rgba(255,255,255,.05)}
nav a.on{background:linear-gradient(270deg,rgba(217,188,132,.18),rgba(217,188,132,.04));color:#F4E6C6;box-shadow:inset -3px 0 0 var(--gold)}
nav a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav .dot{width:9px;height:9px;border-radius:3px;flex:none}
nav .badge{margin-right:auto;background:var(--crit);color:#fff;font-size:11px;border-radius:10px;padding:0 7px}
.aside-foot{margin-top:auto;font-size:11px;color:#7F8CA0;padding:10px;border-top:1px solid rgba(217,188,132,.18)}
main{padding-block:28px 60px;padding-left:max(36px, env(safe-area-inset-left, 0px));padding-right:36px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-size:34px;line-height:1.2;color:var(--head)}
.top .sub{color:var(--muted);font-size:13px}
.demo{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:20px;padding:3px 12px}

/* primitives */
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:15px;font-weight:600;color:var(--head);display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:12px}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px}
.tile .lbl{font-size:12.5px;color:var(--muted)}
.tile .val{font-family:var(--display);font-size:34px;font-weight:700;color:var(--head);line-height:1.25;margin-top:4px}
.tile .delta{font-size:12px;margin-top:2px}
.up{color:var(--good)}.down{color:var(--crit)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;cursor:pointer;font-size:13.5px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--ink);color:#F4E6C6;border-color:var(--gold3)}
.btn.primary:hover{background:var(--navy)}
.btn.gold{background:linear-gradient(180deg,#E3C68E,#B8925A);border-color:#B8925A;color:#0B1626;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:20px;padding:2px 10px;white-space:nowrap}
.pill svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.s-good{background:var(--good-bg);color:var(--good)}.s-warn{background:var(--warn-bg);color:var(--warn)}.s-crit{background:var(--crit-bg);color:var(--crit)}.s-idle{background:var(--idle-bg);color:var(--idle)}.s-info{background:var(--info-bg);color:var(--info)}
.swatch{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.muted{color:var(--muted)} .small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
hr.sep{border:none;border-top:1px solid var(--line2);margin:12px 0}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,input[type=text],input[type=date],input[type=search],textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;min-width:0}
select:focus,input:focus,textarea:focus{outline:2px solid var(--gold2);outline-offset:0}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:none;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2)}
.seg button.on{background:var(--ink);color:#F4E6C6}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.split{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.split2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.dec-cards{display:none}
.tabbar,.scrim{display:none}
.credit{margin-bottom:56px;margin-top:36px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--muted)}
.credit a{color:var(--gold3);font-weight:700;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px}
.credit a:hover{color:var(--gold)}
.wa-fab{position:fixed;z-index:35;left:calc(24px + env(safe-area-inset-left, 0px));bottom:calc(24px + env(safe-area-inset-bottom, 0px));display:inline-flex;align-items:center;gap:8px;padding:11px 18px 11px 20px;border-radius:40px;background:linear-gradient(180deg,#E3C68E,#B8925A);color:#0B1626;font-weight:700;font-size:14px;box-shadow:0 10px 28px rgba(11,22,38,.28);border:1px solid #F2DDAE}
.wa-fab:hover{filter:brightness(1.05);transform:translateY(-1px)}
.wa-fab svg{width:20px;height:20px;fill:none;stroke:#0B1626;stroke-width:1.6;stroke-linejoin:round}
@media (max-width:980px){ .wa-fab{bottom:calc(72px + env(safe-area-inset-bottom, 0px));left:calc(14px + env(safe-area-inset-left, 0px));padding:10px 15px;font-size:13px} }
.credit-mark{width:8px;height:8px;transform:rotate(45deg);border:1.5px solid var(--gold)}
.tile .val,td{font-variant-numeric:tabular-nums}

/* company cards */
.co{position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.co:hover{transform:translateY(-2px)}
.co .bar{position:absolute;top:0;right:0;left:0;height:4px}
.co .name{font-weight:700;font-size:15px;color:var(--head)}
.co .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px}
.co .kv div span{display:block;font-size:11.5px;color:var(--muted)}
.co .kv div b{font-size:16px;color:var(--head)}
.meter{height:6px;border-radius:4px;background:var(--line2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:4px}

/* tables */
table{width:100%;border-collapse:separate;border-spacing:0}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);position:sticky;top:0}
td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#F1E9DA;border-radius:10px;padding:8px 12px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5}
.tip b{color:var(--gold2);display:block;margin-bottom:3px}
.tip .r{display:flex;align-items:center;gap:7px;justify-content:space-between}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* modal */
.modal-bg{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:18px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header h2{font-family:var(--display);font-size:24px}
.modal .body{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal .full{grid-column:1/-1}
.modal label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--text2);font-weight:500}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start}
.err{color:var(--crit);font-size:12.5px;grid-column:1/-1;display:none}
.x{border:none;background:none;font-size:22px;cursor:pointer;color:var(--muted)}

/* misc components */
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end}
.lvl{border:1px solid var(--line);border-bottom:4px solid var(--gold);border-radius:12px 12px 0 0;padding:12px;background:var(--surface);display:flex;flex-direction:column;cursor:pointer}
.lvl.on{background:var(--ink);color:#F1E6CF;border-color:var(--gold3)}
.lvl.on b{color:#F1E6CF}
.lvl.on .muted{color:#AEB8C7}
.lvl .n{font-family:var(--display);font-size:26px;color:var(--gold);line-height:1}
.agenda .it{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.agenda .it .m{font-family:var(--display);font-size:22px;color:var(--gold3);text-align:center}
.agenda .it.cur{background:linear-gradient(270deg,var(--cur),transparent);border-radius:10px}
.timer{font-family:var(--display);font-size:46px;color:var(--head);line-height:1}
.member{display:flex;gap:14px;align-items:flex-start}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;flex:none;background:var(--ink);color:var(--gold2)}
.check{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.check input{margin-top:5px;accent-color:var(--ink);width:16px;height:16px}
.check.done span{color:var(--muted);text-decoration:line-through}
.phase-head{display:flex;align-items:center;gap:12px}
.phase-num{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--gold2);display:grid;place-items:center;font-family:var(--display);font-size:19px;border:2px solid var(--gold)}
.kpi{padding:14px 0;border-bottom:1px solid var(--line2)}
.kpi:last-child{border-bottom:none}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom, 0px));left:calc(24px + env(safe-area-inset-left, 0px));background:var(--ink);color:#F1E6CF;padding:10px 18px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.2s;z-index:60}
.toast.show{opacity:1;transform:none}
.hamb{display:none}

/* ---- v2 modules: clients, files, tasks, risks, calendar, activity, search ---- */
aside{overflow:auto}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn .cnt{background:var(--crit);color:#fff;border-radius:9px;font-size:11px;line-height:17px;padding:0 6px}
.top .tools{flex-wrap:wrap;justify-content:flex-end}
input[type=number],input[type=tel],input[type=email]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;min-width:0}
.modal.wide{width:min(1000px,100%)}
.modal{overflow-x:hidden}
.modal .body{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.modal label>select,.modal label>input,.modal label>textarea{width:100%;min-width:0}
.aside-foot label{display:block;margin-bottom:10px;color:#9AA6B8}
.aside-foot select{width:100%;margin-top:4px;background:rgba(255,255,255,.06);color:#E9E2D3;border:1px solid rgba(217,188,132,.25)}
.aside-foot select option{color:#0B1626;background:#fff}
.sres{margin-top:12px;display:grid;gap:2px}
.sgrp{font-size:12px;color:var(--gold3);font-weight:600;margin:12px 0 4px}
.sitem{display:flex;align-items:center;gap:10px;text-align:right;width:100%;border:none;background:none;padding:9px 10px;border-radius:10px;cursor:pointer}
.sitem:hover,.sitem:focus-visible{background:var(--hover)}
.sitem>span:last-child{display:flex;flex-direction:column;min-width:0}
.stage-row{padding:8px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.stage-row:last-child{border-bottom:none}
.stage-row.on b{color:var(--gold3)}
.mini{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);cursor:pointer;min-width:0}
.mini:last-child{border-bottom:none}
.mini>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more-link{color:var(--gold3);font-size:12.5px;font-weight:500}
/* files */
.files-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.folders{display:grid;gap:2px;position:sticky;top:16px}
.fold{display:flex;justify-content:space-between;align-items:center;gap:8px;border:none;background:none;text-align:right;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--text2)}
.fold:hover{background:var(--hover)}
.fold.on{background:var(--cur);color:var(--head);font-weight:600}
.drop{border:1.5px dashed var(--axis);border-radius:var(--r);padding:18px;text-align:center;color:var(--text2);background:var(--surface2);margin-bottom:14px;cursor:pointer}
.drop .small{color:var(--muted);margin-top:2px}
.drop.over{border-color:var(--gold);background:var(--cur)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(180px,100%),1fr));gap:12px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:6px;cursor:pointer;min-width:0;transition:transform .15s;align-content:start}
.fcard:hover{transform:translateY(-2px);border-color:var(--gold2)}
.fname{font-size:13.5px;color:var(--head);overflow-wrap:anywhere;line-height:1.5}
.fext{display:inline-grid;place-items:center;min-width:42px;height:26px;padding:0 6px;border-radius:7px;background:var(--ink2);border:1px solid var(--line);color:var(--gold2);font-size:11px;font-weight:700;letter-spacing:.04em;font-family:"Segoe UI",system-ui,sans-serif}
.fext.big{min-width:80px;height:52px;font-size:18px;border-radius:12px}
.fview{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.fprev{background:var(--surface2);border-left:1px solid var(--line);min-height:440px;display:grid;place-items:center;padding:18px;overflow:auto}
.fprev img,.fprev video{max-width:100%;max-height:68vh;border-radius:10px}
.fprev iframe{width:100%;height:68vh;border:none;border-radius:10px;background:#fff}
.fprev pre{white-space:pre-wrap;font-size:12.5px;max-height:68vh;overflow:auto;width:100%;text-align:start;align-self:start}
.fnoprev{display:grid;place-items:center;gap:10px;text-align:center}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:26px 26px 30px;width:min(420px,100%);align-self:start}
.paper h4{font-size:22px;color:var(--head);margin-top:12px;line-height:1.4}
.paper p{font-size:13px;margin:6px 0;color:var(--text2)}
.paper .ph{height:8px;border-radius:4px;background:var(--line2);margin-top:10px}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.kcol{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;min-height:180px;align-content:start}
.kcol.drag{outline:2px dashed var(--gold);outline-offset:-4px}
.kh{padding:2px 4px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:grid;gap:7px;cursor:grab;box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--gold2)}
.tcard.donec b{color:var(--muted);text-decoration:line-through}
.mv{border:1px solid var(--line);background:var(--surface2);border-radius:8px;width:32px;height:30px;cursor:pointer;font-size:15px;line-height:1}
.mv:hover{border-color:var(--gold)}
.kadd{justify-content:center;border-style:dashed;background:transparent}
/* risks */
.heat{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:5px}
.heat .lab{font-size:11.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;padding:2px 4px;line-height:1.3}
.heat .cell{border:none;border-radius:9px;min-height:54px;font-family:var(--display);font-size:22px;font-weight:700;cursor:pointer;color:var(--text)}

// Line chart; time runs right→left (RTL). series: [{name,hex,values}]
function lineChart(series, opts={}){
  const small=innerWidth<640, W=small?400:760,H=small?250:(opts.h||260),pl=8,pr=8,pt=16,pb=30, axisW=small?62:56;
  const all = series.flatMap(s=>s.values);
  let max = Math.max(...all), min = opts.zero ? 0 : Math.min(...all);
  const pad=(max-min)*0.12||1; max+=pad; min=Math.max(0,min-pad);
  const ticks=4, step=(max-min)/ticks;
  const x = i => W-pr-axisW - i*((W-pr-axisW-pl)/(MONTHS.length-1));
  const y = v => pt + (H-pt-pb) * (1-(v-min)/(max-min));
  let g='';
  for(let t=0;t<=ticks;t++){ const v=min+t*step, yy=y(v); g+=`<line x1="${pl}" x2="${W-pr-axisW+6}" y1="${yy}" y2="${yy}" stroke="${tok('--grid')}" stroke-width="1"/><text x="${W-pr}" y="${yy+4}" font-size="11" fill="${tok('--muted')}" text-anchor="end">${money(v)}</text>`; }
  MONTHS.forEach((m,i)=>{ g+=`<text x="${x(i)}" y="${H-8}" font-size="11.5" fill="${tok('--muted')}" text-anchor="middle">${m}</text>`; });
  series.forEach(s=>{
    const d=s.values.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
    g+=`<path d="${d}" fill="none" stroke="${s.hex}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li=s.values.length-1;
    g+=`<circle cx="${x(li)}" cy="${y(s.values[li])}" r="4" fill="${s.hex}" stroke="${tok('--surface')}" stroke-width="2"/>`;
  });
  const id='c'+Math.random().toString(36).slice(2,8);
  const html = `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'رسم بياني')}">${g}<line class="xh" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="${tok('--gold')}" stroke-width="1" stroke-dasharray="3 3" opacity="0"/><g class="dots"></g><rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg><div class="tip"></div></div>`;
  setTimeout(()=>{
    const el=document.getElementById(id); if(!el) return;
    const svg=el.querySelector('svg'), tip=el.querySelector('.tip'), xh=el.querySelector('.xh'), dots=el.querySelector('.dots');
    const hide=()=>{ tip.style.opacity=0; xh.setAttribute('opacity',0); dots.innerHTML=''; };
    svg.addEventListener('mouseleave',hide);
    const move=e=>{
      const r=svg.getBoundingClientRect(); const px=(e.clientX-r.left)*(W/r.width);
      let bi=0,bd=1e9; MONTHS.forEach((_,i)=>{ const dd=Math.abs(x(i)-px); if(dd<bd){bd=dd;bi=i;} });
      xh.setAttribute('x1',x(bi)); xh.setAttribute('x2',x(bi)); xh.setAttribute('opacity',1);
      dots.innerHTML=series.map(s=>`<circle cx="${x(bi)}" cy="${y(s.values[bi])}" r="5" fill="${s.hex}" stroke="${tok('--surface')}" stroke-width="2"/>`).join('');
      const rows=[...series].sort((a,b)=>b.values[bi]-a.values[bi]).map(s=>`<div class="r"><span class="row" style="gap:6px"><i class="swatch" style="background:${s.hex}"></i>${esc(s.name)}</span><span>${money(s.values[bi])}</span></div>`).join('');
      tip.innerHTML=`<b>${MONTHS[bi]} ٢٠٢٦</b>${rows}`;
      const tx=(x(bi)/W)*r.width; tip.style.opacity=1;
      tip.style.top='8px'; tip.style.left=Math.max(0,Math.min(r.width-tip.offsetWidth,(tx>r.width/2? tx-tip.offsetWidth-14 : tx+14)))+'px';
    };
    svg.addEventListener('pointermove',move); svg.addEventListener('pointerdown',move);
  });
  return html;
}

function barPair(id){

  });
  g+=`<line x1="${pl}" x2="${W-axisW+6}" y1="${H-pb}" y2="${H-pb}" stroke="${tok('--axis')}"/>`;

}

function companyModules(id){
  const cl=S.clients.filter(c=>c.co===id).sort((a,b)=>b.value-a.value);
  const fl=S.files.filter(f=>f.co===id).sort((a,b)=>b.date.localeCompare(a.date));
  const rk=S.risks.filter(r=>r.co===id&&r.status!=='مغلق').sort((a,b)=>b.L*b.I-a.L*a.I);
  const tk=S.tasks.filter(t=>t.co===id&&t.status!=='done').sort((a,b)=>a.due.localeCompare(b.due));
  const bal=cl.reduce((s,c)=>s+c.bal,0);
  const card=(title,sub,body,go,lbl)=>`<div class="card"><h3>${title} <small>${sub}</small></h3>${body}<a class="more-link" style="display:inline-block;margin-top:10px" href="#${go[0]}" onclick="${go[1]}">${lbl} ←</a></div>`;
  return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));margin-top:16px">
    ${card('العملاء',`${n(cl.length)} · مستحقات ${money(bal)}`, cl.slice(0,4).map(c=>`<div class="mini" onclick="openClient(${c.id})"><span>${esc(clName(c))}</span><span class="pill ${stageCls[c.stage]}">${c.stage}</span></div>`).join('')||'<div class="muted">لا يوجد عملاء.</div>', ['clients',`CF.co='${id}';CF.st=''`], 'كل العملاء')}
    ${card('المستندات',`${n(fl.length)} ملف`, fl.slice(0,4).map(f=>`<div class="mini" onclick="openFile(${f.id})"><span class="row" style="gap:8px;min-width:0"><span class="fext">${extOf(f.name)}</span><span style="overflow:hidden;text-overflow:ellipsis">${esc(f.name)}</span></span></div>`).join('')||'<div class="muted">لا توجد ملفات.</div>', ['files',`FF.co='${id}';FF.folder=''`], 'مكتبة الشركة')}
    ${card('المخاطر المفتوحة',`${n(rk.length)}`, rk.slice(0,4).map(r=>`<div class="mini" onclick="openRisk(${r.id})"><span>${esc(r.title)}</span>${rPill(r.L*r.I)}</div>`).join('')||'<div class="muted">لا مخاطر مفتوحة.</div>', ['risks',`RF.co='${id}';RF.cell=''`], 'سجل المخاطر')}
    ${card('المهام المفتوحة',`${n(tk.length)}`, tk.slice(0,4).map(t=>`<div class="mini" onclick="openTask(${t.id})"><span>${esc(t.title)}</span><span class="pill ${parseD(t.due)<today()?'s-crit':'s-idle'}">${fmtD(t.due)}</span></div>`).join('')||'<div class="muted">لا مهام مفتوحة.</div>', ['tasks',`TF.co='${id}'`], 'لوحة المهام')}
  </div>`;
}

window.saveDecision=function(id){
  const v={co:$('#f_co').value,desc:$('#f_desc').value.trim(),owner:$('#f_owner').value,due:$('#f_due').value,status:$('#f_status').value,evidence:$('#f_ev').value.trim(),reason:$('#f_reason').value.trim(),fileId:+$('#f_file').value||null};
  const err=$('#f_err'); err.style.display='block';
  if(!v.desc){ err.textContent='اكتب وصف القرار.'; return; }
  if(!v.due){ err.textContent='حدّد موعد الإنجاز.'; return; }
  if(!v.evidence && v.fileId){ v.evidence=S.files.find(f=>f.id===v.fileId).name; }
  if(v.status==='مكتمل' && !v.evidence){ err.textContent='لا يُغلق القرار إلا بدليل إنجاز — أضف المستند أو النتيجة الموثقة.'; return; }
  const was=id?S.decisions.find(x=>x.id===id).status:null;
  if(id){ Object.assign(S.decisions.find(x=>x.id===id),v); } else { id=S.nextId++; S.decisions.push({id,...v}); }
  logAct(v.status==='مكتمل'&&was!=='مكتمل' ? `أغلق القرار ${decRef(id)} بدليل «${v.evidence}»` : `${was===null?'أضاف':'حدّث'} القرار ${decRef(id)}`);
  const fm=window._fromMeeting; if(fm){ const m=S.minutes.find(x=>x.id===fm); if(m&&!m.decs.includes(id)) m.decs.push(id); }
  save(); closeModal(); render(); toast('تم حفظ القرار'); if(fm) openMinutes(fm);
};

function quorum(){
  const p=Object.keys(Q.present).filter(k=>Q.present[k]);
  const checks=[
    {ok:p.length>=5, t:`حضور خمسة أعضاء على الأقل (الحاضرون: ${n(p.length)})`},
    {ok:Q.present.chair||Q.present.vice, t:'حضور الرئيس أو نائبة الرئيس'},
  ];
  if(Q.co) checks.push({ok:!!Q.present[Q.co], t:`حضور ممثل ${co(Q.co).short} لأن القرار يخصها`});
  if(Q.fin) checks.push({ok:!!Q.present.fin, t:'حضور الممثل المالي لأن للقرار أثرًا ماليًا'});
  const voters=p.filter(k=>k!==Q.conflict).length;
  return {checks, ok:checks.every(c=>c.ok), voters, need:Math.floor(voters/2)+1};
}

function ago(ts){ const s=(Date.now()-ts)/1000; if(s<60) return 'الآن'; if(s<3600) return rtf.format(-Math.round(s/60),'minute'); if(s<86400) return rtf.format(-Math.round(s/3600),'hour'); if(s<86400*7) return rtf.format(-Math.round(s/86400),'day'); return fmtD(iso(new Date(ts))); }

/* file bytes live in IndexedDB (the JSON state only keeps metadata); memory fallback when storage is blocked */
const MEM=new Map();
const BLOB={
  _db:null,
  open(){ if(!this._db) this._db=new Promise((res,rej)=>{ try{ const r=indexedDB.open('majlis-files',1); r.onupgradeneeded=()=>r.result.createObjectStore('blobs'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); return this._db; },
  async run(mode,fn){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction('blobs',mode); const rq=fn(tx.objectStore('blobs')); tx.oncomplete=()=>res(rq&&rq.result); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); },
  async put(id,b){ try{ await this.run('readwrite',s=>s.put(b,id)); return true; }catch(e){ MEM.set(id,b); return false; } },
  async get(id){ if(MEM.has(id)) return MEM.get(id); try{ return await this.run('readonly',s=>s.get(id)); }catch(e){ return null; } },
  async del(id){ MEM.delete(id); try{ await this.run('readwrite',s=>s.delete(id)); }catch(e){} },
  async clear(){ MEM.clear(); try{ await this.run('readwrite',s=>s.clear()); }catch(e){} },
};

function events(){
  const ev=[], md=parseD(S.meeting.date);
  ev.push({d:S.meeting.date,t:'الاجتماع الشهري للمجلس · '+S.meeting.time,k:'meet',go:"location.hash='meetings'"});
  ev.push({d:iso(addBiz(md,-3)),t:'آخر موعد لاستلام التقارير',k:'dl',go:"location.hash='meetings'"});
  ev.push({d:iso(addBiz(md,2)),t:'آخر موعد لتعميم المحضر',k:'dl',go:"location.hash='meetings'"});
  S.decisions.filter(d=>inScope(d.co)&&d.due&&d.status!=='مكتمل').forEach(d=>ev.push({d:d.due,t:decRef(d.id)+' · '+d.desc,k:effStatus(d)==='متأخر'?'late':'dec',go:`openDecision(${d.id})`}));
  S.tasks.filter(t=>inScope(t.co)&&t.due&&t.status!=='done').forEach(t=>ev.push({d:t.due,t:'مهمة: '+t.title,k:isLateTask(t)?'late':'task',go:`openTask(${t.id})`}));
  S.clients.filter(c=>inScope(c.co)&&c.renew).forEach(c=>ev.push({d:c.renew,t:'تجديد عقد: '+clName(c),k:'renew',go:`openClient(${c.id})`}));
  S.risks.filter(r=>inScope(r.co)&&r.review&&r.status!=='مغلق').forEach(r=>ev.push({d:r.review,t:'مراجعة خطر: '+r.title,k:'risk',go:`openRisk(${r.id})`}));
  S.votes.filter(v=>v.status==='open'&&inScope(v.co)).forEach(v=>ev.push({d:v.deadline,t:'نهاية تصويت: '+v.title,k:'dl',go:"location.hash='votes'"}));
  erpEvents(ev);
  return ev;
}
function upcoming(days,max){
  const list=events().filter(e=>{const x=daysTo(e.d); return x>=0&&x<=days;}).sort((a,b)=>a.d.localeCompare(b.d)).slice(0,max);
  return list.length?list.map(e=>`<button class="evrow" onclick="${e.go}"><span class="evdate">${daysTo(e.d)===0?'اليوم':fmtD(e.d)}</span><span class="ev k-${e.k}" style="max-width:none;flex:1;min-width:0">${esc(e.t)}</span></button>`).join(''):`<div class="muted">لا مواعيد خلال ${n(days)} يومًا.</div>`;
}
function feedItems(list){
  return list.length?list.map(l=>{const m=memberOf(l.who); return `<div class="it"><div class="av-s">${m.name.replace(/^(الدكتور|الأستاذة|ممثل|الممثل)\s*/,'').trim()[0]||'؟'}</div><div class="small"><b>${esc(shortName(m.name))}</b> ${esc(l.what)}</div><span class="when">${ago(l.ts)}</span></div>`;}).join(''):'<div class="muted">لا يوجد نشاط بعد.</div>';
}
function alerts(){
  const a=[];
  S.decisions.filter(d=>inScope(d.co)&&effStatus(d)==='متأخر').forEach(d=>a.push({l:'crit',t:`قرار متأخر ${decRef(d.id)}`,s:d.desc,go:`openDecision(${d.id})`}));
  S.tasks.filter(t=>inScope(t.co)&&isLateTask(t)).forEach(t=>a.push({l:'crit',t:'مهمة متأخرة',s:t.title+' · '+shortName(t.owner),go:`openTask(${t.id})`}));
  S.risks.filter(r=>inScope(r.co)&&r.status!=='مغلق'&&r.L*r.I>=16).forEach(r=>a.push({l:'crit',t:'خطر حرج',s:r.title,go:`openRisk(${r.id})`}));
  S.clients.filter(c=>inScope(c.co)&&c.bal>0&&c.age>90).forEach(c=>a.push({l:'warn',t:'مستحقات تجاوزت ٩٠ يومًا',s:`${clName(c)} · ${money(c.bal)} ريال`,go:`openClient(${c.id})`}));
  S.clients.filter(c=>inScope(c.co)&&c.renew&&daysTo(c.renew)>=0&&daysTo(c.renew)<=45).forEach(c=>a.push({l:'warn',t:`تجديد عقد خلال ${n(daysTo(c.renew))} يومًا`,s:clName(c),go:`openClient(${c.id})`}));
  const rd=subDl(), left=Math.round((rd-today())/864e5);
  COMPANIES.filter(c=>inScope(c.id)).forEach(c=>{ const sb=subOf(c.id), st=sb?sb.status:'draft';
    if((st==='draft'||st==='returned')&&left<=10) a.push({l:left<0?'crit':'warn',t:st==='returned'?'تقرير شهري معاد للتعديل':'تقرير شهري لم يُرسل',s:`${c.short} · آخر موعد ${fmtD(iso(rd))}`,go:`openSub('${c.id}')`});
    if(st==='submitted'&&REVIEWERS.includes(S.me)) a.push({l:'warn',t:'تقرير شهري بانتظار مراجعتك',s:c.short,go:`openSub('${c.id}')`}); });
  S.requests.filter(r=>inScope(r.co)&&myReqTurn(r)).forEach(r=>a.push({l:'warn',t:'طلب اعتماد بانتظار إجرائك',s:r.title,go:`openRequest(${r.id})`}));
  S.votes.filter(v=>v.status==='open'&&!v.v[S.me]&&!v.conflict.includes(S.me)).forEach(v=>a.push({l:'warn',t:'تصويت بانتظار صوتك',s:v.title+' · ينتهي '+fmtD(v.deadline),go:"location.hash='votes'"}));
  S.minutes.filter(m=>m.status==='circulated'&&m.att[S.me]&&!m.conf[S.me]).forEach(m=>a.push({l:'warn',t:'محضر بانتظار تأكيدك',s:'اجتماع '+fmtD(m.date),go:`openMinutes(${m.id})`}));
  erpAlerts(a);
  return a;
}

window.runSearch=function(q){
  q=q.trim(); const box=$('#gres'); if(q.length<2){ box.innerHTML='<div class="muted small" style="padding:14px 0">اكتب حرفين على الأقل.</div>'; return; }
  const has=s=>String(s||'').includes(q);
  const groups=[
    ['القرارات',S.decisions.filter(d=>inScope(d.co)&&(has(d.desc)||has(d.owner)||has(decRef(d.id)))).map(d=>({t:d.desc,s:decRef(d.id)+' · '+coName(d.co),c:d.co,go:`openDecision(${d.id})`}))],
    ['العملاء',S.clients.filter(c=>inScope(c.co)&&(has(clName(c))||has(c.kind)||(seeConf(c)&&(has(c.contact)||has(c.notes))))).map(c=>({t:clName(c),s:c.kind+' · '+coName(c.co),c:c.co,go:`openClient(${c.id})`}))],
    ['المستندات',S.files.filter(f=>inScope(f.co)&&(has(f.name)||has(f.tags)||has(f.folder))).map(f=>({t:f.name,s:f.folder+' · '+coName(f.co),c:f.co,go:`openFile(${f.id})`}))],
    ['المهام',S.tasks.filter(t=>inScope(t.co)&&(has(t.title)||has(t.owner))).map(t=>({t:t.title,s:TST[t.status]+' · '+coName(t.co),c:t.co,go:`openTask(${t.id})`}))],
    ['المخاطر',S.risks.filter(r=>inScope(r.co)&&(has(r.title)||has(r.mit))).map(r=>({t:r.title,s:rLbl[rLvl(r.L*r.I)]+' · '+coName(r.co),c:r.co,go:`openRisk(${r.id})`}))],
    ['طلبات الاعتماد',S.requests.filter(r=>inScope(r.co)&&has(r.title)).map(r=>({t:r.title,s:r.status+' · '+coName(r.co),c:r.co,go:`openRequest(${r.id})`}))],
    ['التصويت',S.votes.filter(v=>inScope(v.co)&&(has(v.title)||has(v.desc))).map(v=>({t:v.title,s:(v.status==='open'?'مفتوح':'مغلق')+' · '+coName(v.co),c:v.co,go:"location.hash='votes'"}))],
    ['المحاضر',S.minutes.filter(m=>m.items.some(it=>has(it.n)||has(it.t))).map(m=>({t:'محضر اجتماع '+m.type+' · '+fmtD(m.date),s:MST[m.status],c:'all',go:`openMinutes(${m.id})`}))],
    ['الأعضاء',MEMBERS.filter(m=>has(m.name)||has(m.role)).map(m=>({t:m.name,s:m.role,c:'all',go:"location.hash='members'"}))],
    ...erpSearch(has,q),
  ].filter(g=>g[1].length);
  box.innerHTML=groups.length?groups.map(([g,items])=>`<div class="sgrp">${g} <span class="muted">${n(items.length)}</span></div>`+items.slice(0,6).map(i=>`<button class="sitem" onclick="closeModal();${i.go}">${dot(i.c)}<span><b>${esc(i.t)}</b><span class="small muted">${esc(i.s)}</span></span></button>`).join('')).join(''):'<div class="empty">لا نتائج مطابقة.</div>';
};

window.dropFiles=function(e){ e.preventDefault(); e.currentTarget.classList.remove('over'); uploadFiles([...e.dataTransfer.files],{}); };
async function uploadFiles(files,p){
  if(!files.length) return;
  const MAX=25*1048576;
  if(p.replace){
    const f=S.files.find(x=>x.id===p.replace), file=files[0]; if(!f||!file) return;
    if(file.size>MAX){ toast('الملف أكبر من ٢٥ م.ب'); return; }
    const ok=await BLOB.put(f.id,file);
    (f.hist=f.hist||[]).unshift({ver:f.ver||1,date:f.date,by:f.by});
    Object.assign(f,{ver:(f.ver||1)+1,size:file.size,type:file.type||'',date:iso(today()),by:S.me,demo:false});
    logAct(`رفع النسخة ${n(f.ver)} من «${f.name}»`); save(); render(); openFile(f.id);
    toast(ok?'رُفعت النسخة الجديدة':'رُفعت النسخة مؤقتًا — التخزين الدائم غير متاح في هذا المتصفح'); return;
  }
  let count=0, mem=false;
  for(const file of files){
    if(file.size>MAX){ toast(`«${file.name}» أكبر من ٢٥ م.ب`); continue; }
    const id=uid(); if(!(await BLOB.put(id,file))) mem=true;
    S.files.unshift({id,name:file.name,size:file.size,type:file.type||'',co:p.co||FF.co||(myScope()!=='all'?myScope():'all'),folder:p.folder||FF.folder||'مستندات عامة',conf:false,tags:'',date:iso(today()),by:S.me,client:p.client||null,decision:p.decision||null,ver:1,hist:[]});
    count++;
  }
  if(!count) return;
  logAct(count===1?`رفع «${S.files[0].name}»`:`رفع ${n(count)} ملفات`); save();
  if(p.client) openClient(p.client); else if(count===1) openFile(S.files[0].id);
  render();
  toast(mem?'رُفعت الملفات مؤقتًا — التخزين الدائم غير متاح في هذا المتصفح':(count===1?'رُفع الملف':`رُفع ${n(count)} ملفات`));
}

async function previewFile(f){
  const b=await BLOB.get(f.id); const box=$('#fprev'); if(!box||box.dataset.id!=String(f.id)) return;
  if(!b){ box.innerHTML=demoPreview(f); return; }
  const url=URL.createObjectURL(b); (window._urls=window._urls||[]).push(url);
  const t=b.type||f.type||'';
  $('#fl_dl').innerHTML=`<a class="btn" href="${url}" download="${esc(f.name)}">تنزيل</a>`;
  if(t.startsWith('image/')) box.innerHTML=`<img src="${url}" alt="${esc(f.name)}">`;
  else if(t==='application/pdf') box.innerHTML=`<iframe src="${url}" title="${esc(f.name)}"></iframe>`;
  else if(t.startsWith('video/')) box.innerHTML=`<video src="${url}" controls></video>`;
  else if(t.startsWith('audio/')) box.innerHTML=`<audio src="${url}" controls></audio>`;
  else if(t.startsWith('text/')||/json|csv|xml/.test(t)||/\.(txt|csv|md|json)$/i.test(f.name)){ const txt=await b.text(); box.innerHTML=`<pre dir="auto">${esc(txt.slice(0,20000))}</pre>`; }
  else box.innerHTML=`<div class="fnoprev"><span class="fext big">${extOf(f.name)}</span><div class="muted small">لا تتوفر معاينة لهذا النوع — استخدم «تنزيل».</div></div>`;
}

let CAL=(()=>{const d=today(); return {y:d.getFullYear(),m:d.getMonth(),sel:iso(d)};})();
const DOW=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

window.calMove=function(d){ if(d===0){ const t=today(); CAL.y=t.getFullYear(); CAL.m=t.getMonth(); CAL.sel=iso(t); } else { CAL.m+=d; if(CAL.m<0){CAL.m=11;CAL.y--;} if(CAL.m>11){CAL.m=0;CAL.y++;} } render(); };
function viewCalendar(){
  const by={}; events().forEach(e=>(by[e.d]=by[e.d]||[]).push(e));
  const dayList=(key,d)=>{ const l=(by[key]||[]).slice(); if(d.getDay()===0) l.push({t:'المتابعة الأسبوعية',k:'weekly',go:"location.hash='tasks'"}); return l; };
  const first=new Date(CAL.y,CAL.m,1), dim=new Date(CAL.y,CAL.m+1,0).getDate(), cells=Math.ceil((first.getDay()+dim)/7)*7;
  const start=new Date(CAL.y,CAL.m,1-first.getDay()), tdy=iso(today());
  let g=DOW.map(d=>`<div class="dow"><span class="hide-sm">${d}</span><span class="show-sm">${d.replace(/^ال/,'')}</span></div>`).join('');
  for(let i=0;i<cells;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const key=iso(d), l=dayList(key,d);
    g+=`<button class="d ${d.getMonth()!==CAL.m?'out':''} ${d.getDay()>=5?'we':''} ${key===tdy?'today':''} ${key===CAL.sel?'sel':''}" onclick="CAL.sel='${key}';render()" aria-label="${fmtD(key)}${l.length?' · '+n(l.length)+' مواعيد':''}"><span class="dn">${n(d.getDate())}</span>${l.slice(0,3).map(e=>`<span class="ev k-${e.k}">${esc(e.t)}</span>`).join('')}${l.length>3?`<span class="more">+${n(l.length-3)} أخرى</span>`:''}<span class="dots">${l.slice(0,5).map(e=>`<i class="k-${e.k}"></i>`).join('')}</span></button>`; }
  const sd=parseD(CAL.sel), sl=dayList(CAL.sel,sd);
  const title=new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{month:'long',year:'numeric'}).format(first);
  return header('التقويم','الاجتماعات ومواعيد التقارير واستحقاق القرارات والمهام وتجديد العقود في مكان واحد',`<button class="btn" onclick="calMove(-1)" aria-label="الشهر السابق">→</button><button class="btn" onclick="calMove(0)">اليوم</button><button class="btn" onclick="calMove(1)" aria-label="الشهر التالي">←</button>`)
  + `<div class="grid">
      <div class="card"><h3><span class="serif" style="font-size:24px">${title}</span><small>الأسبوع يبدأ الأحد · الجمعة والسبت عطلة</small></h3><div class="cal">${g}</div>
        <div class="legend" style="margin-top:12px">${KINDS.map(([k,l])=>`<span><span class="ev k-${k}" style="padding:0 8px">${l}</span></span>`).join('')}</div></div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))">
      <div class="card"><h3>${new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{weekday:'long',day:'numeric',month:'long'}).format(sd)}</h3>
        ${sl.length?sl.map(e=>`<button class="evrow" onclick="${e.go}"><span class="ev k-${e.k}" style="max-width:none;flex:1;min-width:0;white-space:normal">${esc(e.t)}</span></button>`).join(''):'<div class="muted">لا مواعيد في هذا اليوم.</div>'}
      </div>
      <div class="card"><h3>القادم خلال ٣٠ يومًا</h3>${upcoming(30,10)}</div>
      </div>
    </div>`;
}

const subCls={draft:'s-idle',submitted:'s-info',returned:'s-warn',approved:'s-good'};

const subOf=c=>S.subs.find(s=>s.co===c&&s.month===curMonth());
const subDl=()=>addBiz(parseD(S.meeting.date),-3);
const numIn=(id,v,extra='')=>`<input type="number" step="any" id="${id}" value="${v??''}" ${extra}>`;
function spark(h,col,w=90,hh=26){
  if(!h||h.length<2) return '';
  const mn=Math.min(...h),mx=Math.max(...h),r=mx-mn||1;
  const p=h.map((v,i)=>[(w-3-i*(w-6)/(h.length-1)).toFixed(1),(hh-4-(v-mn)/r*(hh-8)).toFixed(1)]); // time runs right→left
  return `<svg width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}" aria-hidden="true" style="flex:none"><polyline points="${p.map(x=>x.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${p[p.length-1][0]}" cy="${p[p.length-1][1]}" r="2.8" fill="${col}"/></svg>`;
}

/* ---- Monthly reports ---- */
function viewReports(){
  const dl=subDl(), list=COMPANIES.filter(c=>inScope(c.id));
  const st=c=>(subOf(c.id)||{status:'draft'}).status, cnt=k=>list.filter(c=>st(c)===k).length;
  return header('التقارير الشهرية',`دورة ${monthName(curMonth())} · آخر موعد للإرسال ${fmtD(iso(dl))} (قبل الاجتماع بثلاثة أيام عمل)`)
  + `<div class="grid tiles">${[['approved','معتمدة'],['submitted','بانتظار المراجعة'],['returned','معادة للتعديل'],['draft','لم تُرسل']].map(([k,l])=>`<div class="card tile"><div class="lbl">${l}</div><div class="val">${n(cnt(k))} <span class="small muted">/ ${n(list.length)}</span></div></div>`).join('')}</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));margin-top:16px">
    ${list.map(c=>{const s=subOf(c.id), k=s?s.status:'draft', onTime=s&&s.at?parseD(s.at)<=dl:null, lateNow=!s?.at&&today()>dl;
      const act=S.me===c.id&&(k==='draft'||k==='returned')?'تعبئة التقرير وإرساله':(REVIEWERS.includes(S.me)&&k==='submitted'?'مراجعة واعتماد':'عرض التقرير');
      return `<div class="card co" onclick="openSub('${c.id}')"><i class="bar" style="background:${c.hex}"></i>
        <div class="row between"><span class="name">${c.short}</span><span class="pill ${subCls[k]}">${SUBST[k]}</span></div>
        <div class="kv"><div><span>الإيرادات</span><b>${s&&s.rev!=null?money(s.rev):'—'}</b></div><div><span>المصروفات</span><b>${s&&s.exp!=null?money(s.exp):'—'}</b></div>
        <div><span>تاريخ الإرسال</span><b style="font-size:14px">${s&&s.at?fmtD(s.at):'—'}</b></div><div><span>الالتزام بالموعد</span><b style="font-size:14px">${onTime===null?(lateNow?'<span class="down">متأخر</span>':'—'):onTime?'<span class="up">في الموعد</span>':'<span class="down">متأخر</span>'}</b></div></div>
        ${k==='returned'&&s.review?`<div class="notice" style="margin-top:10px">ملاحظة المراجع: ${esc(s.review)}</div>`:''}
        <button class="btn ${act==='عرض التقرير'?'':'primary'}" style="margin-top:12px">${act}</button></div>`;}).join('')}
    </div>
    <p class="small muted" style="margin-top:12px">يعبّئ ممثل كل شركة تقريرها ويرسله، ويراجعه أمين المجلس فيعتمده أو يعيده بملاحظات. الأرقام المعتمدة تحدّث لوحة المجلس وملف الشركة تلقائيًا — جرّب ذلك بتغيير «تعمل الآن بصفة».</p>`;
}
window.openSub=function(c){
  let s=subOf(c);
  if(!s){ s={id:uid(),co:c,month:curMonth(),status:'draft',rev:null,exp:null,cash:null,coll:null,payables:null,kv:S.kpis[c].map(()=>null),notes:'',by:c,at:''}; S.subs.push(s); save(); }
  const edit=S.me===c&&(s.status==='draft'||s.status==='returned'), rev=REVIEWERS.includes(S.me)&&s.status==='submitted', ro=edit?'':'disabled';
  const f=(lbl,k)=>field(lbl,numIn('sb_'+k,s[k],ro));
  openModal(mhead(`التقرير الشهري — ${co(c).short}`)+`<div class="body">
    <div class="full row between"><span class="small muted">${monthName(s.month)} · آخر موعد ${fmtD(iso(subDl()))}</span><span class="pill ${subCls[s.status]}">${SUBST[s.status]}</span></div>
    ${!edit&&!rev&&s.status!=='approved'?`<div class="full notice">${s.status==='submitted'?'التقرير بانتظار مراجعة أمين المجلس.':'يعبّئ هذا التقرير ممثل '+co(c).short+' — غيّر «تعمل الآن بصفة» لتجربة ذلك.'}</div>`:''}
    ${s.status==='returned'&&s.review?`<div class="full notice">ملاحظة المراجع: ${esc(s.review)}</div>`:''}
    ${f('الإيرادات (ألف ريال)','rev')}${f('المصروفات (ألف ريال)','exp')}${f('السيولة المتاحة (ألف ريال)','cash')}${f('الالتزامات القادمة (ألف ريال)','payables')}${f('نسبة التحصيل ٪','coll')}
    <div class="full sec-title">مؤشرات الأداء</div>
    ${S.kpis[c].map((k,i)=>field(`${esc(k.t)} <span class="muted">· المستهدف ${n(k.g,1)}${k.u}</span>`,numIn('sb_k'+i,s.kv[i],ro))).join('')}
    ${field('أبرز الإنجازات والتحديات والقرارات المطلوبة',`<textarea id="sb_notes" rows="3" ${ro}>${esc(s.notes)}</textarea>`,1)}
    ${rev?field('ملاحظة المراجعة (مطلوبة عند الإعادة)',`<textarea id="sb_review" rows="2"></textarea>`,1):''}
    ${s.status==='approved'?`<div class="full small muted">اعتمده ${esc(shortName(memberOf(s.rby).name))} في ${fmtD(s.rat)}</div>`:''}
    <div class="err" id="sb_err"></div></div>
  <footer style="flex-wrap:wrap">${edit?`<button class="btn primary" onclick="subAct('${c}','send')">إرسال للمراجعة</button><button class="btn" onclick="subAct('${c}','save')">حفظ كمسودة</button>`:''}${rev?`<button class="btn primary" onclick="subAct('${c}','approve')">اعتماد</button><button class="btn" onclick="subAct('${c}','return')">إعادة للتعديل</button>`:''}<button class="btn" onclick="closeModal()">إغلاق</button></footer>`);
};
window.subAct=function(c,a){
  const s=subOf(c), err=$('#sb_err'), F5=['rev','exp','cash','payables','coll'];
  if(a==='save'||a==='send'){
    const g=k=>{ const v=$('#sb_'+k).value; return v===''?null:+v; };
    F5.forEach(k=>s[k]=g(k)); s.kv=S.kpis[c].map((_,i)=>g('k'+i)); s.notes=$('#sb_notes').value.trim();
    if(a==='send'){
      if(F5.some(k=>s[k]==null)||s.kv.some(v=>v==null)){ err.style.display='block'; err.textContent='أكمل جميع الأرقام والمؤشرات قبل الإرسال.'; save(); return; }
      s.status='submitted'; s.at=iso(today()); s.by=S.me; logAct(`أرسل التقرير الشهري لـ ${co(c).short}`);
    }
    save(); closeModal(); render(); toast(a==='send'?'أُرسل التقرير للمراجعة':'حُفظت المسودة'); return;
  }
  const note=$('#sb_review').value.trim();
  if(a==='return'){ if(!note){ err.style.display='block'; err.textContent='اكتب ملاحظة توضح المطلوب تعديله.'; return; } Object.assign(s,{status:'returned',review:note,rby:S.me,rat:iso(today())}); logAct(`أعاد التقرير الشهري لـ ${co(c).short} للتعديل`); }
  if(a==='approve'){
    Object.assign(s,{status:'approved',review:note,rby:S.me,rat:iso(today())});
    const f=S.fin[c]; f.rev[f.rev.length-1]=s.rev; f.exp[f.exp.length-1]=s.exp; Object.assign(f,{cash:s.cash,coll:s.coll,payables:s.payables});
    S.kpis[c].forEach((k,i)=>{ if(s.kv[i]!=null){ k.v=s.kv[i]; if(k.h) k.h[k.h.length-1]=s.kv[i]; } });
    S.reports[c]=REPORT_ITEMS.map(()=>1); logAct(`اعتمد التقرير الشهري لـ ${co(c).short}`);
  }
  save(); closeModal(); render(); toast(a==='approve'?'اعتُمد التقرير وحُدّثت اللوحة':'أُعيد التقرير للتعديل');
};

/* ---- Minutes ---- */
const MST={draft:'مسودة',circulated:'معمّم للتأكيد',approved:'معتمد'}, mCls={draft:'s-idle',circulated:'s-info',approved:'s-good'};
function viewMinutes(){
  const list=[...S.minutes].sort((a,b)=>b.date.localeCompare(a.date));
  return header('محاضر الاجتماعات','يُعمَّم المحضر خلال يومي عمل، ويُعتمد بتأكيد جميع الأعضاء الحاضرين',S.me==='sec'?`<button class="btn primary" onclick="newMeeting()">+ اجتماع استثنائي</button>`:'')
  + `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))">${list.map(m=>{const att=MEMBERS.filter(x=>m.att[x.key]), cf=att.filter(x=>m.conf[x.key]).length;
    return `<div class="card co" onclick="openMinutes(${m.id})"><div class="row between"><span class="name">اجتماع ${m.type} · ${fmtD(m.date)}</span><span class="pill ${mCls[m.status]}">${MST[m.status]}</span></div>
    <div class="kv"><div><span>الحضور</span><b>${n(att.length)} / ${n(MEMBERS.length)}</b></div><div><span>القرارات المتخذة</span><b>${n(m.decs.length)}</b></div>
    <div><span>تأكيد الأعضاء</span><b>${n(m.status==='draft'?0:cf)} / ${n(att.length)}</b><div class="meter"><i style="width:${att.length&&m.status!=='draft'?cf/att.length*100:0}%;background:var(--gold)"></i></div></div><div><span>موعد التعميم</span><b style="font-size:14px">${fmtD(iso(addBiz(parseD(m.date),2)))}</b></div></div></div>`;}).join('')}</div>
    ${S.me!=='sec'?'<p class="small muted" style="margin-top:12px">يحرّر المحضر أمين المجلس، ويؤكده كل عضو حاضر بعد تعميمه.</p>':''}`;
}
window.newMeeting=function(){ const m={id:uid(),date:iso(today()),type:'استثنائي',att:{},items:[{t:'موضوع الاجتماع',n:''}],decs:[],status:'draft',conf:{}}; S.minutes.push(m); logAct('أنشأ محضر اجتماع استثنائي'); save(); render(); openMinutes(m.id); };
window.openMinutes=function(id){
  const m=S.minutes.find(x=>x.id===id); if(!m) return;
  const ed=m.status==='draft'&&S.me==='sec', ro=ed?'':'disabled';
  const att=MEMBERS.filter(x=>m.att[x.key]), qok=att.length>=5&&(m.att.chair||m.att.vice);
  const canConf=m.status==='circulated'&&m.att[S.me]&&!m.conf[S.me];
  openModal(mhead(`محضر اجتماع ${m.type} — ${fmtD(m.date)}`)+`<div class="body">
    <div class="full row between"><span class="pill ${mCls[m.status]}">${MST[m.status]}</span>${ed?`<input type="date" value="${m.date}" onchange="mSet(${id},'date',this.value)">`:''}</div>
    <div class="full sec-title" style="border:none;padding:0">الحضور <span class="small ${qok?'up':'down'}">· ${qok?'النصاب مكتمل':'النصاب غير مكتمل'} (${n(att.length)})</span></div>
    <div class="full grid q-grid" style="grid-template-columns:1fr 1fr;gap:4px 12px">${MEMBERS.map(x=>`<label class="row small" style="flex-direction:row;cursor:pointer"><input type="checkbox" ${m.att[x.key]?'checked':''} ${ro} onchange="mAtt(${id},'${x.key}',this.checked)">${shortName(x.name)}${m.status!=='draft'&&m.conf[x.key]?' <span class="pill s-good">أكّد</span>':''}</label>`).join('')}</div>
    <div class="full sec-title">البنود والمناقشات</div>
    ${m.items.map((it,i)=>field(`${n(i+1)}. ${esc(it.t)}`,`<textarea rows="2" ${ro} onchange="mItem(${id},${i},this.value)" placeholder="ملخص النقاش وما انتهى إليه">${esc(it.n)}</textarea>`,1)).join('')}
    <div class="full sec-title row between">القرارات المتخذة ${ed?`<button class="btn" onclick="decFromMeeting(${id})">+ قرار من هذا الاجتماع</button>`:''}</div>
    <div class="full">${m.decs.map(d=>S.decisions.find(x=>x.id===d)).filter(Boolean).map(d=>`<div class="mini" onclick="openDecision(${d.id})"><span>${decRef(d.id)} · ${esc(d.desc)}</span>${pill(effStatus(d))}</div>`).join('')||'<div class="muted small">لم تُسجّل قرارات بعد.</div>'}</div>
    ${m.status!=='draft'?`<div class="full small muted">التأكيدات: ${att.map(x=>`${shortName(x.name)} ${m.conf[x.key]?'('+fmtD(m.conf[x.key])+')':'— بانتظار'}`).join(' · ')}</div>`:''}
  </div>
  <footer style="flex-wrap:wrap">${ed?`<button class="btn primary" onclick="mCirculate(${id})">تعميم المحضر للأعضاء</button>`:''}${canConf?`<button class="btn primary" onclick="mConfirm(${id})">أؤكد اطلاعي على المحضر وموافقتي</button>`:''}<button class="btn" onclick="mText(${id})">نص المحضر</button><button class="btn" onclick="closeModal()">إغلاق</button></footer>`,true);
};
const mGet=id=>S.minutes.find(x=>x.id===id);
window.mSet=(id,k,v)=>{ mGet(id)[k]=v; save(); };
window.mAtt=(id,k,v)=>{ const m=mGet(id); if(v) m.att[k]=1; else delete m.att[k]; save(); openMinutes(id); };
window.mItem=(id,i,v)=>{ mGet(id).items[i].n=v; save(); };
window.decFromMeeting=id=>{ openDecision(null,'all'); window._fromMeeting=id; };
window.mCirculate=id=>{ const m=mGet(id); if(!MEMBERS.some(x=>m.att[x.key])){ toast('حدّد الحضور أولًا'); return; } m.status='circulated'; m.conf={}; if(m.att.sec) m.conf.sec=iso(today()); logAct(`عمّم محضر اجتماع ${fmtD(m.date)}`); save(); render(); openMinutes(id); toast('عُمّم المحضر للأعضاء'); };
window.mConfirm=id=>{ const m=mGet(id); m.conf[S.me]=iso(today()); if(MEMBERS.every(x=>!m.att[x.key]||m.conf[x.key])) m.status='approved'; logAct(`أكّد محضر اجتماع ${fmtD(m.date)}`); save(); render(); openMinutes(id); toast(m.status==='approved'?'اكتملت التأكيدات واعتُمد المحضر':'سُجّل تأكيدك'); };
window.mText=id=>{ const m=mGet(id);
  const t=[`محضر اجتماع ${m.type} — المجلس الإشرافي المشترك`,`التاريخ: ${fmtD(m.date)}`,`الحضور: ${MEMBERS.filter(x=>m.att[x.key]).map(x=>x.name).join('، ')}`,'',...m.items.map((it,i)=>`${i+1}. ${it.t}${it.n?'\n   '+it.n:''}`),'','القرارات:',...m.decs.map(d=>S.decisions.find(x=>x.id===d)).filter(Boolean).map(d=>`- ${decRef(d.id)}: ${d.desc} — المسؤول: ${d.owner} — الموعد: ${fmtD(d.due)}`)].join('\n');
  copyBox('نص المحضر',t,'انسخ النص لمشاركته أو أرشفته.'); };

/* ---- Voting between meetings ---- */
const VLBL={yes:'موافق',no:'غير موافق',abstain:'ممتنع'};
function vTally(v){ const el=MEMBERS.filter(m=>!v.conflict.includes(m.key)), c={yes:0,no:0,abstain:0}; el.forEach(m=>{ const x=v.v[m.key]; if(x) c[x]++; }); const need=Math.floor(el.length/2)+1; return {...c,el:el.length,cast:c.yes+c.no+c.abstain,need,pass:c.yes>=need}; }
function viewVotes(){
  const list=S.votes.filter(v=>inScope(v.co)).sort((a,b)=>(a.status==='open'?0:1)-(b.status==='open'?0:1)||b.opened.localeCompare(a.opened));
  return header('التصويت بالتمرير','قرارات عاجلة بين الاجتماعات · يُقرّ البند بموافقة أغلبية الأعضاء المؤهلين',['chair','vice','sec'].includes(S.me)?`<button class="btn primary" onclick="openVoteNew()">+ طرح بند للتصويت</button>`:'')
  + `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))">${list.map(voteCard).join('')||'<div class="empty">لا توجد عمليات تصويت.</div>'}</div>`;
}
function voteCard(v){
  const t=vTally(v), mine=v.v[S.me], conf=v.conflict.includes(S.me), open=v.status==='open', mgr=['chair','sec'].includes(S.me);
  const seg=(k,col)=>t[k]?`<div style="flex:${t[k]};background:${col};border-radius:4px" title="${VLBL[k]}: ${n(t[k])}"></div>`:'';
  return `<div class="card"><div class="row between" style="align-items:flex-start"><b style="font-size:15px;color:var(--head)">${esc(v.title)}</b><span class="pill ${open?'s-info':t.pass?'s-good':'s-crit'}">${open?'مفتوح':t.pass?'أُقرّ':'لم يُقرّ'}</span></div>
   <div class="small muted row" style="margin:6px 0;gap:6px;flex-wrap:wrap">${dot(v.co)}${coName(v.co)}${v.amount?' · '+money(v.amount)+' ريال':''} · ${open?'ينتهي '+fmtD(v.deadline):'أُغلق'}</div>
   <div class="small">${esc(v.desc)}</div>
   <div style="display:flex;gap:2px;height:12px;margin:12px 0 8px;background:var(--line2);border-radius:4px">${seg('yes','var(--good)')}${seg('no','var(--crit)')}${seg('abstain','var(--idle)')}${t.el-t.cast?`<div style="flex:${t.el-t.cast}"></div>`:''}</div>
   <div class="legend"><span><i class="swatch" style="background:var(--good)"></i>موافق ${n(t.yes)}</span><span><i class="swatch" style="background:var(--crit)"></i>غير موافق ${n(t.no)}</span><span><i class="swatch" style="background:var(--idle)"></i>ممتنع ${n(t.abstain)}</span><span class="muted">لم يصوّت ${n(t.el-t.cast)} · المطلوب للإقرار ${n(t.need)}</span></div>
   ${v.conflict.length?`<div class="small muted" style="margin-top:6px">أفصح عن تعارض مصالح: ${v.conflict.map(k=>shortName(memberOf(k).name)).join('، ')}</div>`:''}
   ${open?`<hr class="sep">${conf?'<div class="small">أفصحت عن تعارض مصالح، فلا تصوّت على هذا البند.</div>':`<div class="row" style="flex-wrap:wrap"><span class="small muted">صوتك:</span>${Object.keys(VLBL).map(k=>`<button class="btn ${mine===k?'primary':''}" onclick="castVote(${v.id},'${k}')">${VLBL[k]}</button>`).join('')}</div>`}
     <div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn" onclick="toggleConflict(${v.id})">${conf?'إلغاء الإفصاح':'إفصاح عن تعارض مصالح'}</button>${mgr?`<button class="btn" onclick="closeVote(${v.id})">إغلاق التصويت</button>`:''}</div>`
   :(t.pass?(v.dec?`<div class="small" style="margin-top:10px">سُجّل في سجل القرارات: <a href="#decisions" class="more-link" onclick="event.preventDefault();openDecision(${v.dec})">${decRef(v.dec)}</a></div>`:(mgr?`<button class="btn" style="margin-top:10px" onclick="voteToDecision(${v.id})">تحويل إلى قرار في السجل</button>`:'')):'')}
  </div>`;
}
const vGet=id=>S.votes.find(x=>x.id===id);
window.castVote=(id,k)=>{ const v=vGet(id); v.v[S.me]=k; logAct(`صوّت على «${v.title}»`); save(); render(); toast('سُجّل صوتك: '+VLBL[k]); };
window.toggleConflict=id=>{ const v=vGet(id); if(v.conflict.includes(S.me)) v.conflict=v.conflict.filter(k=>k!==S.me); else { v.conflict.push(S.me); delete v.v[S.me]; logAct(`أفصح عن تعارض مصالح في «${v.title}»`); } save(); render(); };
window.closeVote=id=>{ const v=vGet(id), t=vTally(v); ask('إغلاق التصويت',`النتيجة الحالية: ${n(t.yes)} موافق من ${n(t.el)} أعضاء مؤهلين، والمطلوب ${n(t.need)}. ${t.pass?'سيُقرّ البند.':'لن يُقرّ البند.'}`,'إغلاق التصويت',()=>{ v.status='closed'; logAct(`أغلق التصويت على «${v.title}» — ${t.pass?'أُقرّ':'لم يُقرّ'}`); save(); render(); }); };
window.voteToDecision=id=>{ const v=vGet(id), did=S.nextId++; S.decisions.push({id:did,co:v.co,desc:v.title,owner:'الممثل الإداري',due:iso(addBiz(today(),10)),status:'لم يبدأ',evidence:'',reason:'أُقرّ بالتصويت بالتمرير'}); v.dec=did; logAct(`حوّل نتيجة التصويت إلى القرار ${decRef(did)}`); save(); render(); toast('أُضيف إلى سجل القرارات'); };

window.reqAct=function(id,a){
  const r=S.requests.find(x=>x.id===id), note=($('#rq_note')||{value:''}).value.trim();

  const lbl={ok:r.stage===2?'اعتماد الطلب':'رفع إلى «'+RSTEPS[r.stage+1]+'»',back:'إعادة للاستكمال',no:'رفض الطلب',resub:'إعادة التقديم'}[a];
  r.steps.push({who:S.me,act:lbl,note,d:iso(today())});

/* ---- Finance: budget vs actual + cash forecast ---- */
const NEXTM=['ديسمبر','يناير','فبراير'];
const avg3=a=>a.slice(-3).reduce((s,x)=>s+x,0)/3, sumA=a=>a.reduce((s,x)=>s+x,0);
function forecast(c){ // simple 3-month projection: inflow = avg revenue × collection rate + a quarter of overdue balances; outflow = avg expenses + a third of upcoming payables
  const f=S.fin[c], od=S.clients.filter(x=>x.co===c&&x.age>60).reduce((s,x)=>s+x.bal,0); let cash=f.cash;
  return NEXTM.map(m=>{ const inflow=avg3(f.rev)*f.coll/100+od*0.25, out=avg3(f.exp)+f.payables/3; cash+=inflow-out; return {m,inflow,out,cash}; });
}
function varPill(a,b,lowGood){ const v=(a-b)/b*100, good=lowGood?v<=0:v>=0, near=Math.abs(v)<=5; return `<span class="pill ${good?'s-good':near?'s-warn':'s-crit'}">${v>=0?'+':'−'}${n(Math.abs(v),1)}٪</span>`; }

  const endCash=list.reduce((s,c)=>s+forecast(c.id)[2].cash,0);

      <div class="card tile"><div class="lbl">المصروفات منذ ${MONTHS[0]}</div><div class="val">${money(ae)}</div><div class="delta">${varPill(ae,be,true)} <span class="muted">عن الموازنة ${money(be)}</span></div></div>
      <div class="card tile"><div class="lbl">النتيجة التشغيلية منذ ${MONTHS[0]}</div><div class="val">${money(ar-ae)}</div><div class="delta">${varPill(ar-ae,br-be)} <span class="muted">عن الموازنة</span></div></div>
      <div class="card tile"><div class="lbl">السيولة المتوقعة نهاية ${NEXTM[2]}</div><div class="val">${money(endCash)}</div><div class="delta muted">مجموع الشركات · تقديري</div></div></div>
    <div class="tbl-wrap" style="margin-top:16px"><table><thead><tr><th>الشركة</th><th>إيرادات ${MONTHS[L]}</th><th>الموازنة</th><th>الانحراف</th><th>مصروفات ${MONTHS[L]}</th><th>الموازنة</th><th>الانحراف</th><th>الإيرادات منذ ${MONTHS[0]}</th><th>الانحراف</th></tr></thead><tbody>
    ${list.map(c=>{const f=S.fin[c.id],b=B(c); return `<tr onclick="location.hash='company-${c.id}'"><td><span class="row" style="gap:6px">${dot(c.id)}<b>${c.short}</b></span></td><td>${money(f.rev[L])}</td><td class="muted">${money(b.rev[L])}</td><td>${varPill(f.rev[L],b.rev[L])}</td><td>${money(f.exp[L])}</td><td class="muted">${money(b.exp[L])}</td><td>${varPill(f.exp[L],b.exp[L],true)}</td><td>${money(sumA(f.rev))}</td><td>${varPill(sumA(f.rev),sumA(b.rev))}</td></tr>`;}).join('')}
    </tbody></table></div>
    <div class="dec-cards">${list.map(c=>{const f=S.fin[c.id],b=B(c); return `<div class="dec-card"><div class="row between"><span class="row" style="gap:6px">${dot(c.id)}<b>${c.short}</b></span>${varPill(sumA(f.rev),sumA(b.rev))}</div><div class="meta"><span>إيرادات الشهر ${money(f.rev[L])} ${varPill(f.rev[L],b.rev[L])}</span><span>مصروفات الشهر ${money(f.exp[L])} ${varPill(f.exp[L],b.exp[L],true)}</span></div></div>`;}).join('')}</div>

/* ---- Shared services ---- */
const BASIS={rev:'حسب الإيرادات',equal:'بالتساوي',use:'حسب الاستخدام'};
function alloc(s){
  const out={};
  if(s.basis==='equal') COMPANIES.forEach(c=>out[c.id]=1/COMPANIES.length);
  else if(s.basis==='use'){ const t=COMPANIES.reduce((a,c)=>a+(s.use[c.id]||0),0)||1; COMPANIES.forEach(c=>out[c.id]=(s.use[c.id]||0)/t); }
  else { const t=COMPANIES.reduce((a,c)=>a+last(S.fin[c.id].rev),0); COMPANIES.forEach(c=>out[c.id]=last(S.fin[c.id].rev)/t); }
  return out;
}
function viewServices(){
  const tot={}; COMPANIES.forEach(c=>tot[c.id]=0); S.services.forEach(s=>{ const a=alloc(s); COMPANIES.forEach(c=>tot[c.id]+=s.cost*a[c.id]); });
  const mgr=['sec','fin','chair'].includes(S.me), pend=S.services.filter(s=>COMPANIES.some(c=>!s.ok[c.id])).length;
  return header('الخدمات والتكاليف المشتركة','لكل خدمة مقدّمها وأساس توزيع تكلفتها، وتعتمد كل شركة حصتها',mgr?`<button class="btn primary" onclick="openService()">+ خدمة مشتركة</button>`:'')
  + `<div class="grid tiles">

const EVQ=['يصل جدول الأعمال والتقارير قبل الاجتماع بوقت كافٍ','التقارير الشهرية دقيقة وفي موعدها','النقاش يركّز على القرارات لا على التفاصيل التشغيلية','لكل قرار مسؤول وموعد واضحان','القرارات تُنفَّذ وتُتابَع حتى الإغلاق','الصلاحيات واضحة ولا تتداخل مع إدارات الشركات','تعارض المصالح يُفصَح عنه ويُدار','المجلس يضيف قيمة ملموسة للشركات'];
const qKey=()=>{ const d=today(); return d.getFullYear()+'-Q'+(Math.floor(d.getMonth()/3)+1); };
function viewEval(){
  const q=qKey(), E=S.evals[q]||{}, mine=E[S.me]||[];

  const avgs=EVQ.map((t,i)=>({t,a:avg(i)})), rated=avgs.filter(x=>x.a), overall=rated.length?rated.reduce((s,x)=>s+x.a,0)/rated.length:0;
  const sorted=[...rated].sort((a,b)=>a.a-b.a);
  return header('تقييم أداء المجلس',`التقييم الذاتي ربع السنوي · ${q.slice(0,4)} — الربع ${n(+q.slice(-1))}`)
  + `<div class="grid tiles">

      <div class="card tile"><div class="lbl">أقوى جانب</div><div style="font-weight:600;margin-top:6px">${sorted.length?esc(sorted[sorted.length-1].t):'—'}</div></div>

    <div class="grid split2" style="margin-top:16px">
      <div class="card"><h3>تقييمك <small>${esc(shortName(me().name))} · ١ لا أوافق بشدة — ٥ أوافق بشدة</small></h3>
        ${EVQ.map((t,i)=>`<div class="kpi"><div>${t}</div><div class="seg" style="margin-top:6px" role="group" aria-label="${t}">${[1,2,3,4,5].map(v=>`<button class="${mine[i]===v?'on':''}" onclick="rate(${i},${v})">${n(v)}</button>`).join('')}</div></div>`).join('')}</div>

        ${avgs.map(x=>`<div style="padding:7px 0"><div class="row between small"><span>${x.t}</span><b>${x.a?n(x.a,1):'—'}</b></div><div class="meter"><i style="width:${x.a/5*100}%;background:${x.a&&x.a<3?'var(--crit)':'var(--gold)'}"></i></div></div>`).join('')}
        ${sorted.length?`<hr class="sep"><div class="small"><b>مجالات التحسين:</b> ${sorted.slice(0,2).map(x=>esc(x.t)).join('، ')}</div>`:''}</div>

window.openRec=function(id,rid,preset){

window.saveRec=function(id,rid){
  const D=REG[id], v={};
  for(const x of D.fields){ const el=$('#rf_'+x.k); if(!el) continue; let val=el.value; if(x.t==='num') val=+val||0; if(x.t==='emp') val=+val||null; if(x.t==='opt'&&/^\d+$/.test(val)) val=+val; if(typeof val==='string') val=val.trim();

window.runDep=function(){

const SRCL={opening:'افتتاحي',manual:'يدوي',inv:'فاتورة مبيعات',rcpt:'تحصيل',bill:'فاتورة مورد',bpay:'سداد مورد',payroll:'رواتب',paypay:'صرف رواتب',gosi:'تأمينات',dep:'إهلاك',month:'ملخص شهري',claim:'مصروفات',asset:'أصول',eosb:'نهاية خدمة',void:'عكس قيد'};
let LF={tab:'je',co:'',src:'',q:'',acct:'1120',lim:40};
const jeAmt=j=>j.lines.reduce((s,l)=>s+l[1],0);
function viewLedger(){
  const cos=LF.co?[LF.co]:scopeCos().map(c=>c.id), js=S.journal.filter(j=>cos.includes(j.co));
  const dr=js.reduce((s,j)=>s+jeAmt(j),0), cr=js.reduce((s,j)=>s+j.lines.reduce((a,l)=>a+l[2],0),0), ok=Math.abs(dr-cr)<1;
  const top=header('القيود ودليل الحسابات','نظام القيد المزدوج: كل عملية في المنصة تُنشئ قيدها آليًا',csvBtn+`<button class="btn primary" onclick="openJE()">+ قيد يدوي</button>`)
    + `<div class="filters"><select onchange="LF.co=this.value;render()" aria-label="الشركة"><option value="">كل الشركات</option>${coOpts(LF.co,false)}</select></div>`
    + `<div class="grid tiles">${tile('عدد القيود',n(js.length))}${tile('إجمالي المدين',sarK(dr))}${tile('إجمالي الدائن',sarK(cr))}${tile('ميزان المراجعة',ok?'متوازن':'غير متوازن',ok?'المدين = الدائن':'فرق '+SAR(dr-cr),ok?'good':'crit')}</div>`
    + `<div style="margin-top:16px">${tabs('LF.tab',LF.tab,[['je','القيود اليومية'],['coa','دليل الحسابات'],['gl','دفتر الأستاذ']])}</div>`;
  if(LF.tab==='coa'){ const cs=scopeCos().filter(c=>cos.includes(c.id));
    return top+`<div class="tbl-x"><table class="stmt"><thead><tr><th>الحساب</th><th>النوع</th>${cs.map(c=>`<th>${c.short}</th>`).join('')}${cs.length>1?'<th>المجموع</th>':''}</tr></thead><tbody>${ACCTS.map(a=>{ const v=cs.map(c=>bal(a[0],[c.id])); return `<tr style="cursor:pointer" onclick="LF.tab='gl';LF.acct='${a[0]}';render()"><td><b>${a[0]}</b> ${a[1]}</td><td class="small muted">${{A:'أصول',L:'خصوم',E:'حقوق ملكية',R:'إيرادات',X:'مصروفات'}[a[2]]}</td>${v.map(x=>`<td>${x?SAR(x):'—'}</td>`).join('')}${cs.length>1?`<td><b>${SAR(v.reduce((s,x)=>s+x,0))}</b></td>`:''}</tr>`;}).join('')}</tbody></table></div>`; }
  if(LF.tab==='gl'){ let run=0; const lines=[]; js.slice().sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id).forEach(j=>j.lines.forEach(l=>{ if(l[0]===LF.acct){ run+='AX'.includes(acctType(l[0]))?l[1]-l[2]:l[2]-l[1]; lines.push({j,dr:l[1],cr:l[2],run}); } }));
    return top+`<div class="filters"><select onchange="LF.acct=this.value;render()" aria-label="الحساب">${acctOpts(LF.acct)}</select></div>
      <div class="tbl-x"><table class="stmt"><thead><tr><th>التاريخ</th><th>القيد</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead><tbody>${lines.map(x=>`<tr style="cursor:pointer" onclick="openJEView(${x.j.id})"><td>${fmtD(x.j.d)}</td><td class="small">${x.j.ref}${cos.length>1?' · '+coName(x.j.co):''}</td><td>${esc(x.j.memo)}</td><td>${x.dr?SAR(x.dr):''}</td><td>${x.cr?SAR(x.cr):''}</td><td><b>${SAR(x.run)}</b></td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا حركات على هذا الحساب.</td></tr>'}</tbody></table></div>`; }
  const rows=js.filter(j=>(!LF.src||j.src===LF.src)&&(!LF.q||(j.memo+' '+j.ref).includes(LF.q))).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id), shown=rows.slice(0,LF.lim);
  return top+`<div class="filters"><select onchange="LF.src=this.value;render()" aria-label="المصدر"><option value="">كل المصادر</option>${Object.entries(SRCL).map(([k,l])=>`<option value="${k}" ${LF.src===k?'selected':''}>${l}</option>`).join('')}</select>${sbox('LF',LF.q,'بحث بالبيان أو رقم القيد')}</div>
    <div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>رقم القيد</th><th>البيان</th><th>الشركة</th><th>المصدر</th><th>المبلغ</th></tr></thead><tbody>${shown.map(j=>`<tr onclick="openJEView(${j.id})"><td>${fmtD(j.d)}</td><td class="small">${j.ref}</td><td>${esc(j.memo)}</td><td>${coCell(j.co)}</td><td><span class="pill s-idle">${SRCL[j.src]||j.src}</span></td><td>${SAR(jeAmt(j))}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا قيود.</td></tr>'}</tbody></table></div>
    <div class="dec-cards">${shown.map(j=>`<div class="dec-card" onclick="openJEView(${j.id})"><div class="row between"><b>${esc(j.memo)}</b><span>${SAR(jeAmt(j))}</span></div><div class="meta"><span>${fmtD(j.d)}</span><span>${j.ref}</span><span>${coName(j.co)}</span><span>${SRCL[j.src]||''}</span></div></div>`).join('')}</div>
    ${rows.length>LF.lim?`<div style="text-align:center;margin-top:14px"><button class="btn" onclick="LF.lim+=60;render()">عرض المزيد (${n(rows.length-LF.lim)})</button></div>`:''}`;
}

window.openBill=function(id){ const b=id?S.bills.find(x=>x.id===id):{co:defCo(),sup:null,no:'',date:todayI(),due:iso(new Date(today().getTime()+30*864e5)),desc:'',acct:'5900',amt:0,vr:VAT,status:'received'}, ro=id&&b.status!=='received';

    <footer style="flex-wrap:wrap">${!ro?`<button class="btn primary" onclick="saveBill(${id||'null'})">حفظ</button>`:''}${id&&can&&b.status==='received'?`<button class="btn gold" onclick="billAct(${id},'approved')">اعتماد وقيد</button>`:''}${id&&can&&b.status==='approved'?`<button class="btn gold" onclick="billAct(${id},'paid')">سداد من البنك</button>`:''}${id&&!can&&b.status!=='paid'?'<span class="small muted">يعتمد الفواتير ويسددها ممثل الشركة أو الممثل المالي.</span>':''}<button class="btn" onclick="closeModal()">إغلاق</button></footer>`); };
window.saveBill=function(id){ const v={co:$('#bl_co').value,sup:+$('#bl_sup').value||null,no:$('#bl_no').value.trim(),acct:$('#bl_ac').value,date:$('#bl_d').value,due:$('#bl_due').value,amt:+$('#bl_amt').value||0,vr:+$('#bl_vr').value,desc:$('#bl_desc').value.trim()};

window.billAct=function(id,st){ const b=S.bills.find(x=>x.id===id); b.status=st;

let BKF={co:''};
function viewBanks(){
  BKF.co=fixCo(BKF.co||scopeCos()[0].id,false); const c=BKF.co, bk=S.banks[c], m=todayI().slice(0,7);
  const tx=[]; S.journal.filter(j=>j.co===c).forEach(j=>j.lines.forEach(l=>{ if(l[0]==='1120') tx.push({j,amt:l[1]-l[2]}); }));
  tx.sort((a,b)=>b.j.d.localeCompare(a.j.d)||b.j.id-a.j.id);
  const book=bal('1120',[c]), recB=tx.filter(t=>t.j.rec).reduce((s,t)=>s+t.amt,0), unrec=tx.filter(t=>!t.j.rec);
  const inM=tx.filter(t=>t.j.d.slice(0,7)===m&&t.amt>0).reduce((s,t)=>s+t.amt,0), outM=tx.filter(t=>t.j.d.slice(0,7)===m&&t.amt<0).reduce((s,t)=>s-t.amt,0);
  const tot=scopeCos().reduce((s,x)=>s+bal('1120',[x.id]),0);
  return header('البنوك والخزينة','أرصدة الحسابات البنكية والحركات ومطابقة كشف الحساب')
  + `<div class="filters">${coSeg('BKF.co',c,false)}</div>
    <div class="grid tiles">${tile('رصيد الدفاتر',sarK(book),esc(bk.bank)+' · ****'+bk.last4)}${tile('الوارد هذا الشهر',sarK(inM))}${tile('المنصرف هذا الشهر',sarK(outM))}${tile('حركات غير مطابقة',n(unrec.length),SAR(unrec.reduce((s,t)=>s+t.amt,0))+' ريال صافي',unrec.length?'warn':'')}${scopeCos().length>1?tile('إجمالي النقد لدى الشركات',sarK(tot)):''}</div>
    <div class="card" style="margin-top:16px"><h3>مطابقة كشف الحساب <small>${esc(bk.acc)}</small></h3>
      <div class="row" style="flex-wrap:wrap;gap:14px"><label class="small" style="display:flex;flex-direction:column;gap:4px">رصيد كشف البنك<input type="number" step="any" value="${bk.stmt??''}" placeholder="${SAR(recB)}" onchange="S.banks['${c}'].stmt=this.value===''?null:+this.value;save();render()" style="width:180px"></label>
      <div class="small">الرصيد المطابق في الدفاتر: <b>${SAR(recB)}</b></div>${bk.stmt!=null?`<div class="small">الفرق: <b class="${Math.abs(bk.stmt-recB)<1?'up':'down'}">${SAR(bk.stmt-recB)}</b> ${Math.abs(bk.stmt-recB)<1?'<span class="pill s-good">مطابق</span>':''}</div>`:''}</div>
      <div class="small muted" style="margin-top:8px">ضع علامة على الحركات الظاهرة في كشف البنك. الحركات غير المؤشرة هي شيكات أو تحويلات لم تظهر بعد.</div></div>
    <div class="tbl-x" style="margin-top:16px"><table class="stmt"><thead><tr><th>مطابق</th><th>التاريخ</th><th>البيان</th><th>وارد</th><th>منصرف</th></tr></thead><tbody>${tx.slice(0,80).map(t=>`<tr><td><input type="checkbox" ${t.j.rec?'checked':''} ${canFin(c)?'':'disabled'} onchange="S.journal.find(x=>x.id===${t.j.id}).rec=this.checked;save();render()" aria-label="مطابقة"></td><td>${fmtD(t.j.d)}</td><td>${esc(t.j.memo)}<div class="small muted">${t.j.ref}</div></td><td class="up">${t.amt>0?SAR(t.amt):''}</td><td class="down">${t.amt<0?SAR(-t.amt):''}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------- Financial statements, VAT & zakat ---------- */
let SF={co:'',per:'m10',tab:'is'};
const PERS={m10:['أكتوبر ٢٠٢٦','2026-10-01','2026-10-31'],m11:['نوفمبر ٢٠٢٦ حتى تاريخه','2026-11-01','2026-11-30'],q4:['الربع الرابع حتى تاريخه','2026-10-01','2026-12-31']};
function viewStatements(){
  SF.co=fixCo(SF.co,true); ELIM=SF.co==='all'; const cos=cosOf(SF.co), [pl,from,to]=PERS[SF.per];
  const sum=(type,f,t)=>ACCTS.filter(a=>a[2]===type).map(a=>({a,v:bal(a[0],cos,f,t)})).filter(x=>Math.abs(x.v)>.5);
  const rows=(list,neg)=>list.map(x=>`<tr><td>${x.a[0]} · ${x.a[1]}</td><td>${SAR(neg?-x.v:x.v)}</td></tr>`).join('');
  const T=l=>l.reduce((s,x)=>s+x.v,0);
  let body='';
  if(SF.tab==='is'){ const R=sum('R',from,to), X=sum('X',from,to), cogs=X.filter(x=>x.a[0]==='5100'), opx=X.filter(x=>x.a[0]!=='5100'), rv=T(R), gp=rv-T(cogs), np=gp-T(opx);
    const mgt=SF.per==='m10'?cos.reduce((s,c)=>s+S.fin[c].rev[4]*1000,0):null;
    body=`<div class="tbl-x"><table class="stmt"><thead><tr><th>قائمة الدخل — ${pl}</th><th>ريال</th></tr></thead><tbody><tr class="grp"><td colspan="2">الإيرادات</td></tr>${rows(R)}<tr class="sum"><td>إجمالي الإيرادات</td><td>${SAR(rv)}</td></tr>
      <tr class="grp"><td colspan="2">تكلفة الإيرادات</td></tr>${rows(cogs)}<tr class="sum"><td>مجمل الربح <span class="small muted">(${n(rv?gp/rv*100:0,1)}٪)</span></td><td>${SAR(gp)}</td></tr>
      <tr class="grp"><td colspan="2">المصروفات التشغيلية</td></tr>${rows(opx)}<tr class="sum"><td>صافي الربح قبل الزكاة <span class="small muted">(${n(rv?np/rv*100:0,1)}٪)</span></td><td class="${np>=0?'up':'down'}">${SAR(np)}</td></tr></tbody></table></div>
      ${mgt!=null?`<div class="notice" style="margin-top:12px">${Math.abs(mgt-rv)<1?'✓ إيرادات الدفاتر لشهر أكتوبر تطابق التقرير الشهري المعتمد ('+SAR(mgt)+' ريال).':'فرق بين الدفاتر والتقرير الشهري: '+SAR(rv-mgt)+' ريال.'}</div>`:''}`; }
  if(SF.tab==='bs'){ const A=sum('A'), L=sum('L'), E=sum('E'), pr=T(sum('R'))-T(sum('X')), ta=T(A), tl=T(L), te=T(E)+pr;
    body=`<div class="tbl-x"><table class="stmt"><thead><tr><th>قائمة المركز المالي — كما في ${fmtD(todayI())}</th><th>ريال</th></tr></thead><tbody><tr class="grp"><td colspan="2">الأصول</td></tr>${rows(A)}<tr class="sum"><td>إجمالي الأصول</td><td>${SAR(ta)}</td></tr>
      <tr class="grp"><td colspan="2">الخصوم</td></tr>${rows(L)}<tr class="sum"><td>إجمالي الخصوم</td><td>${SAR(tl)}</td></tr>
      <tr class="grp"><td colspan="2">حقوق الملكية</td></tr>${rows(E)}<tr><td>صافي ربح الفترة منذ أكتوبر</td><td>${SAR(pr)}</td></tr><tr class="sum"><td>إجمالي حقوق الملكية</td><td>${SAR(te)}</td></tr>
      <tr class="sum"><td>الخصوم وحقوق الملكية</td><td>${SAR(tl+te)} ${Math.abs(ta-tl-te)<1?'<span class="pill s-good">متوازنة</span>':'<span class="pill s-crit">غير متوازنة</span>'}</td></tr></tbody></table></div>
      <div class="grid tiles" style="margin-top:14px">${tile('نسبة التداول',n((bal('1120',cos)+bal('1130',cos)+bal('1140',cos)+bal('1150',cos)+bal('1160',cos))/Math.max(1,bal('2110',cos)+bal('2120',cos)+bal('2130',cos)+bal('2140',cos)+bal('2150',cos)),2),'الأصول المتداولة ÷ الخصوم المتداولة')}${tile('نسبة المديونية',n(tl/Math.max(1,ta)*100,1)+'٪','الخصوم ÷ الأصول')}${tile('النقد',sarK(bal('1120',cos)+bal('1110',cos)))}</div>`; }
  if(SF.tab==='tb'){ let td=0,tc=0; const r=ACCTS.map(a=>{ let d=0,c=0; S.journal.forEach(j=>{ if(cos.includes(j.co)&&!(ELIM&&j.ic)) j.lines.forEach(l=>{ if(l[0]===a[0]){ d+=l[1]; c+=l[2]; } }); }); const net=d-c; td+=net>0?net:0; tc+=net<0?-net:0; return {a,net}; }).filter(x=>Math.abs(x.net)>.5);
    body=`<div class="tbl-x"><table class="stmt"><thead><tr><th>ميزان المراجعة — كما في ${fmtD(todayI())}</th><th>مدين</th><th>دائن</th></tr></thead><tbody>${r.map(x=>`<tr><td>${x.a[0]} · ${x.a[1]}</td><td>${x.net>0?SAR(x.net):''}</td><td>${x.net<0?SAR(-x.net):''}</td></tr>`).join('')}<tr class="sum"><td>الإجمالي ${Math.abs(td-tc)<1?'<span class="pill s-good">متوازن</span>':''}</td><td>${SAR(td)}</td><td>${SAR(tc)}</td></tr></tbody></table></div>`; }
  if(SF.tab==='vat'){ const qf='2026-10-01', qt='2026-12-31'; let out=0,inp=0; S.journal.forEach(j=>{ if(!cos.includes(j.co)||j.d<qf||j.d>qt) return; j.lines.forEach(l=>{ if(l[0]==='2120') out+=l[2]-l[1]; if(l[0]==='1160') inp+=l[1]-l[2]; }); });
    const prof=c=>ACCTS.filter(a=>a[2]==='R').reduce((s,a)=>s+bal(a[0],[c]),0)-ACCTS.filter(a=>a[2]==='X').reduce((s,a)=>s+bal(a[0],[c]),0);
    const zb=cos.reduce((s,c)=>s+Math.max(0,bal('3100',[c])+bal('3200',[c])+prof(c)+bal('2210',[c])+bal('2220',[c])-(bal('1210',[c])+bal('1220',[c]))),0);
    body=`<div class="grid split2"><div class="card"><h3>إقرار ضريبة القيمة المضافة — الربع الرابع ٢٠٢٦ <small>حتى تاريخه</small></h3><div class="tbl-x"><table class="stmt"><thead><tr><th>البند</th><th>المبلغ الخاضع</th><th>الضريبة</th></tr></thead><tbody>
      <tr><td>المبيعات الخاضعة للنسبة الأساسية ١٥٪</td><td>${SAR(out/VAT)}</td><td>${SAR(out)}</td></tr><tr><td>المشتريات الخاضعة للنسبة الأساسية ١٥٪</td><td>${SAR(inp/VAT)}</td><td>${SAR(inp)}</td></tr>
      <tr class="sum"><td>صافي الضريبة المستحقة</td><td></td><td class="${out-inp>=0?'down':'up'}">${SAR(out-inp)}</td></tr></tbody></table></div>
      <div class="small muted" style="margin-top:10px">آخر موعد للتقديم والسداد: ٣١ يناير ٢٠٢٧ (بعد نهاية الربع بشهر).</div></div>
      <div class="card"><h3>الزكاة — تقدير أولي</h3><div class="kvs"><div><div class="small">الوعاء الزكوي التقديري</div><b>${SAR(zb)}</b></div><div><div class="small">الزكاة ٢٫٥٪ (سنوي)</div><b>${SAR(zb*.025)}</b></div></div><div class="small muted" style="margin-top:10px">حقوق الملكية والمخصصات والقروض ناقصًا الأصول الثابتة، مضافًا إليها صافي الربح. تقدير للمتابعة فقط — الإقرار النهائي يُعدّ مع المحاسب القانوني وفق لائحة جباية الزكاة.</div></div></div>`; }
  if(SF.tab==='cf') body=stmtCF(cos,from,to,pl); if(SF.tab==='cc') body=stmtCC(cos); ELIM=false;
  return header('القوائم المالية والضريبة','قائمة الدخل والمركز المالي والتدفقات النقدية وميزان المراجعة والضريبة ومراكز التكلفة — من الدفاتر مباشرة',csvBtn)
  + `<div class="filters">${coSeg('SF.co',SF.co,true)}${['is','cf'].includes(SF.tab)?`<div class="seg">${Object.entries(PERS).map(([k,v])=>`<button class="${SF.per===k?'on':''}" onclick="SF.per='${k}';render()">${v[0]}</button>`).join('')}</div>`:''}</div>
    ${tabs('SF.tab',SF.tab,[['is','قائمة الدخل'],['bs','المركز المالي'],['cf','التدفقات النقدية'],['tb','ميزان المراجعة'],['vat','الضريبة والزكاة'],['cc','مراكز التكلفة']])}${SF.co==='all'?`<div class="notice" style="margin-bottom:12px">قوائم موحّدة: استُبعدت المعاملات بين الشركات (${SAR(icElim(cos))} ريال) من الإيرادات والمصروفات والأرصدة المتبادلة. <a class="more-link" href="#ic">المعاملات بين الشركات ←</a></div>`:''}${body}`;

    case 'leave': return n(sc(S.leaves).filter(l=>l.status==='بانتظار الاعتماد').length)+' طلبات معلقة'; case 'recruit': return n(sc(S.jobs).filter(j=>j.status==='مفتوحة').length)+' وظائف مفتوحة'; case 'training': return n(sc(S.training).filter(t=>t.status==='مخطط').length)+' برامج قادمة';

function stmtCF(cos,from,to,pl){
  const CAT={rcpt:['op','المتحصّل من العملاء'],insc:['op','المتحصّل من شركات التأمين'],edufee:['op','المتحصّل من رسوم التدريب'],bpay:['op','المدفوع للموردين'],paypay:['op','الرواتب المدفوعة'],claim:['op','مصروفات الموظفين'],petty:['op','مصروفات الصندوق النقدي'],loan:['op','سلف الموظفين'],month:['op','صافي التدفق التشغيلي — ملخص أكتوبر'],ic:['op','تسويات بين الشركات'],gosi:['op','التأمينات الاجتماعية'],eosb:['op','مكافآت نهاية الخدمة'],asset:['inv','شراء أصول ثابتة']};
  let open=0; const g={op:{},inv:{},fin:{}};
  S.journal.forEach(j=>{ if(!cos.includes(j.co)||(ELIM&&j.ic)||j.d>to) return; const dlt=j.lines.reduce((s,l)=>s+(l[0]==='1110'||l[0]==='1120'?l[1]-l[2]:0),0); if(Math.abs(dlt)<.005) return;
    if(j.d<from||j.src==='opening'){ open+=dlt; return; }
    let c=CAT[j.src]; if(!c){ const ac=j.lines.map(l=>l[0]); c=ac.some(a=>['2220','3100'].includes(a))?['fin','تمويل ورأس مال']:ac.includes('1210')?['inv','شراء أصول ثابتة']:['op',j.src==='void'?'عكوسات وتصحيحات':'قيود يدوية وأخرى']; }
    g[c[0]][c[1]]=(g[c[0]][c[1]]||0)+dlt; });
  const T=o=>Object.values(o).reduce((s,v)=>s+v,0), net=T(g.op)+T(g.inv)+T(g.fin), close=open+net;
  const books=cos.reduce((s,c)=>s+bal('1110',[c],null,to)+bal('1120',[c],null,to),0);
  const sec=(k,t)=>`<tr class="grp"><td colspan="2">${t}</td></tr>${Object.entries(g[k]).sort((a,b)=>b[1]-a[1]).map(([l,v])=>`<tr><td>${l}</td><td class="${v<0?'down':''}">${SAR(v)}</td></tr>`).join('')||'<tr><td class="muted">لا حركات</td><td>٠</td></tr>'}<tr class="sum"><td>صافي ${t}</td><td>${SAR(T(g[k]))}</td></tr>`;
  return `<div class="tbl-x"><table class="stmt"><thead><tr><th>قائمة التدفقات النقدية (الطريقة المباشرة) — ${pl}</th><th>ريال</th></tr></thead><tbody><tr><td><b>النقد أول الفترة</b></td><td><b>${SAR(open)}</b></td></tr>
    ${sec('op','التدفقات من الأنشطة التشغيلية')}${sec('inv','التدفقات من الأنشطة الاستثمارية')}${sec('fin','التدفقات من الأنشطة التمويلية')}
    <tr class="sum"><td>صافي التغير في النقد</td><td class="${net>=0?'up':'down'}">${SAR(net)}</td></tr><tr class="sum"><td>النقد آخر الفترة ${Math.abs(close-books)<1?'<span class="pill s-good">يطابق الدفاتر</span>':'<span class="pill s-crit">فرق '+SAR(close-books)+'</span>'}</td><td>${SAR(close)}</td></tr></tbody></table></div>
    <div class="small muted" style="margin-top:8px">النقد = النقدية بالصندوق (١١١٠) والحساب البنكي (١١٢٠). تُصنف الحركات آليًا من مصدر كل قيد.</div>`;
}
