<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1626">
<meta name="author" content="روّاد">
<title>منصّة المجلس</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>document.documentElement.dir='rtl';document.documentElement.lang='ar';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: dark navy rail (sidebar on desktop, bottom tabs on phones) beside an ivory working surface; gold marks the council, four fixed hues mark the companies. */
  --head:#0B1626; --ink:#0B1626; --ink2:#13233A; --navy:#1B2F4B;
  --bg:#F6F2EA; --surface:#FFFFFF; --surface2:#FBF8F2; --line:#E7DECD; --line2:#F0EADF;
  --gold:#B8925A; --gold2:#D9BC84; --gold3:#8A6A3B;
  --text:#1D2633; --text2:#4A5463; --muted:#7A8392;
  /* categorical — fixed order, validated (light) */
  --c-clinic:#1F5FA8; --c-factory:#C08A2E; --c-law:#8E4BB0; --c-edu:#119C84; --c-exp:#B9C1CC;
  --grid:#EFE8DA; --axis:#CFC5B3; --hover:#FCFAF5; --scrim:rgba(8,17,30,.5); --cur:#F6EDD9;
  /* status — reserved */
  --good:#2F7D4F; --good-bg:#E3F1E8; --warn:#9A6A12; --warn-bg:#FBEFD6; --crit:#B23A2E; --crit-bg:#F8E2DF; --idle:#5B6574; --idle-bg:#ECEFF3; --info:#2D5B9A; --info-bg:#E5ECF6;
  --r:14px; --shadow:0 1px 2px rgba(11,22,38,.04),0 8px 24px rgba(11,22,38,.05);
  --display:"Amiri",Georgia,serif; --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --head:#F1E9DA; --bg:#0A111C; --surface:#121B29; --surface2:#172234; --line:#263449; --line2:#1C2838;
  --gold:#C9A465; --gold3:#D9BC84; --text:#E6E1D7; --text2:#B9C1CD; --muted:#8D97A6;
  --c-clinic:#5B8FD6; --c-factory:#B98222; --c-law:#A779CC; --c-edu:#14967E; --c-exp:#4A5668;
  --grid:#1E2A3B; --axis:#33435A; --hover:#162131; --scrim:rgba(0,0,0,.6); --cur:#2A2617;
  --good:#7CCB98; --good-bg:#16301F; --warn:#E3B45A; --warn-bg:#33270F; --crit:#F08A7E; --crit-bg:#3A1A17; --idle:#A9B3C1; --idle-bg:#222D3C; --info:#8DB4EA; --info-bg:#172A45;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --head:#F1E9DA; --bg:#0A111C; --surface:#121B29; --surface2:#172234; --line:#263449; --line2:#1C2838;
  --gold:#C9A465; --gold3:#D9BC84; --text:#E6E1D7; --text2:#B9C1CD; --muted:#8D97A6;
  --c-clinic:#5B8FD6; --c-factory:#B98222; --c-law:#A779CC; --c-edu:#14967E; --c-exp:#4A5668;
  --grid:#1E2A3B; --axis:#33435A; --hover:#162131; --scrim:rgba(0,0,0,.6); --cur:#2A2617;
  --good:#7CCB98; --good-bg:#16301F; --warn:#E3B45A; --warn-bg:#33270F; --crit:#F08A7E; --crit-bg:#3A1A17; --idle:#A9B3C1; --idle-bg:#222D3C; --info:#8DB4EA; --info-bg:#172A45;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
.serif{font-family:var(--display)}
a{color:inherit;text-decoration:none}

/* layout */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:radial-gradient(140% 80% at 50% 0%,#18304F 0%,var(--ink) 65%);color:#E9E2D3;padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;border-bottom:1px solid rgba(217,188,132,.18)}
.brand b{font-family:var(--display);font-size:21px;color:var(--gold2);display:block;line-height:1.2}
.brand span{font-size:11.5px;color:#9AA6B8}
nav{margin-top:18px;display:flex;flex-direction:column;gap:2px}
nav .grp{font-size:11px;color:#7F8CA0;margin:16px 10px 6px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:#CBD3DF;font-size:14px}
nav a:hover{background:rgba(255,255,255,.05)}
nav a.on{background:linear-gradient(270deg,rgba(217,188,132,.18),rgba(217,188,132,.04));color:#F4E6C6;box-shadow:inset -3px 0 0 var(--gold)}
nav a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav .dot{width:9px;height:9px;border-radius:3px;flex:none}
nav .badge{margin-right:auto;background:var(--crit);color:#fff;font-size:11px;border-radius:10px;padding:0 7px}
.aside-foot{margin-top:auto;font-size:11px;color:#7F8CA0;padding:10px;border-top:1px solid rgba(217,188,132,.18)}
main{padding-block:28px 60px;padding-left:max(36px, env(safe-area-inset-left, 0px));padding-right:36px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-size:34px;line-height:1.2;color:var(--head)}
.top .sub{color:var(--muted);font-size:13px}
.demo{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:20px;padding:3px 12px}

/* primitives */
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:15px;font-weight:600;color:var(--head);display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:12px}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px}
.tile .lbl{font-size:12.5px;color:var(--muted)}
.tile .val{font-family:var(--display);font-size:34px;font-weight:700;color:var(--head);line-height:1.25;margin-top:4px}
.tile .delta{font-size:12px;margin-top:2px}
.up{color:var(--good)}.down{color:var(--crit)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;cursor:pointer;font-size:13.5px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--ink);color:#F4E6C6;border-color:var(--gold3)}
.btn.primary:hover{background:var(--navy)}
.btn.gold{background:linear-gradient(180deg,#E3C68E,#B8925A);border-color:#B8925A;color:#0B1626;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:20px;padding:2px 10px;white-space:nowrap}
.pill svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.s-good{background:var(--good-bg);color:var(--good)}.s-warn{background:var(--warn-bg);color:var(--warn)}.s-crit{background:var(--crit-bg);color:var(--crit)}.s-idle{background:var(--idle-bg);color:var(--idle)}.s-info{background:var(--info-bg);color:var(--info)}
.swatch{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.muted{color:var(--muted)} .small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
hr.sep{border:none;border-top:1px solid var(--line2);margin:12px 0}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,input[type=text],input[type=date],input[type=search],textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;min-width:0}
select:focus,input:focus,textarea:focus{outline:2px solid var(--gold2);outline-offset:0}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:none;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2)}
.seg button.on{background:var(--ink);color:#F4E6C6}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.split{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.split2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.dec-cards{display:none}
.tabbar,.scrim{display:none}
.credit{margin-bottom:56px;margin-top:36px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--muted)}
.credit a{color:var(--gold3);font-weight:700;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px}
.credit a:hover{color:var(--gold)}
.wa-fab{position:fixed;z-index:35;left:calc(24px + env(safe-area-inset-left, 0px));bottom:calc(24px + env(safe-area-inset-bottom, 0px));display:inline-flex;align-items:center;gap:8px;padding:11px 18px 11px 20px;border-radius:40px;background:linear-gradient(180deg,#E3C68E,#B8925A);color:#0B1626;font-weight:700;font-size:14px;box-shadow:0 10px 28px rgba(11,22,38,.28);border:1px solid #F2DDAE}
.wa-fab:hover{filter:brightness(1.05);transform:translateY(-1px)}
.wa-fab svg{width:20px;height:20px;fill:none;stroke:#0B1626;stroke-width:1.6;stroke-linejoin:round}
@media (max-width:980px){ .wa-fab{bottom:calc(72px + env(safe-area-inset-bottom, 0px));left:calc(14px + env(safe-area-inset-left, 0px));padding:10px 15px;font-size:13px} }
.credit-mark{width:8px;height:8px;transform:rotate(45deg);border:1.5px solid var(--gold)}
.tile .val,td{font-variant-numeric:tabular-nums}

/* company cards */
.co{position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.co:hover{transform:translateY(-2px)}
.co .bar{position:absolute;top:0;right:0;left:0;height:4px}
.co .name{font-weight:700;font-size:15px;color:var(--head)}
.co .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px}
.co .kv div span{display:block;font-size:11.5px;color:var(--muted)}
.co .kv div b{font-size:16px;color:var(--head)}
.meter{height:6px;border-radius:4px;background:var(--line2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:4px}

/* tables */
table{width:100%;border-collapse:separate;border-spacing:0}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);position:sticky;top:0}
td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#F1E9DA;border-radius:10px;padding:8px 12px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5}
.tip b{color:var(--gold2);display:block;margin-bottom:3px}
.tip .r{display:flex;align-items:center;gap:7px;justify-content:space-between}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* modal */
.modal-bg{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:18px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header h2{font-family:var(--display);font-size:24px}
.modal .body{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal .full{grid-column:1/-1}
.modal label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--text2);font-weight:500}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start}
.err{color:var(--crit);font-size:12.5px;grid-column:1/-1;display:none}
.x{border:none;background:none;font-size:22px;cursor:pointer;color:var(--muted)}

/* misc components */
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end}
.lvl{border:1px solid var(--line);border-bottom:4px solid var(--gold);border-radius:12px 12px 0 0;padding:12px;background:var(--surface);display:flex;flex-direction:column;cursor:pointer}
.lvl.on{background:var(--ink);color:#F1E6CF;border-color:var(--gold3)}
.lvl.on b{color:#F1E6CF}
.lvl.on .muted{color:#AEB8C7}
.lvl .n{font-family:var(--display);font-size:26px;color:var(--gold);line-height:1}
.agenda .it{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.agenda .it .m{font-family:var(--display);font-size:22px;color:var(--gold3);text-align:center}
.agenda .it.cur{background:linear-gradient(270deg,var(--cur),transparent);border-radius:10px}
.timer{font-family:var(--display);font-size:46px;color:var(--head);line-height:1}
.member{display:flex;gap:14px;align-items:flex-start}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;flex:none;background:var(--ink);color:var(--gold2)}
.check{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.check input{margin-top:5px;accent-color:var(--ink);width:16px;height:16px}
.check.done span{color:var(--muted);text-decoration:line-through}
.phase-head{display:flex;align-items:center;gap:12px}
.phase-num{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--gold2);display:grid;place-items:center;font-family:var(--display);font-size:19px;border:2px solid var(--gold)}
.kpi{padding:14px 0;border-bottom:1px solid var(--line2)}
.kpi:last-child{border-bottom:none}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom, 0px));left:calc(24px + env(safe-area-inset-left, 0px));background:var(--ink);color:#F1E6CF;padding:10px 18px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.2s;z-index:60}
.toast.show{opacity:1;transform:none}
.hamb{display:none}

/* ---- v2 modules: clients, files, tasks, risks, calendar, activity, search ---- */
aside{overflow:auto}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn .cnt{background:var(--crit);color:#fff;border-radius:9px;font-size:11px;line-height:17px;padding:0 6px}
.top .tools{flex-wrap:wrap;justify-content:flex-end}
input[type=number],input[type=tel],input[type=email]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;min-width:0}
.modal.wide{width:min(1000px,100%)}
.modal{overflow-x:hidden}
.modal .body{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.modal label>select,.modal label>input,.modal label>textarea{width:100%;min-width:0}
.aside-foot label{display:block;margin-bottom:10px;color:#9AA6B8}
.aside-foot select{width:100%;margin-top:4px;background:rgba(255,255,255,.06);color:#E9E2D3;border:1px solid rgba(217,188,132,.25)}
.aside-foot select option{color:#0B1626;background:#fff}
.sres{margin-top:12px;display:grid;gap:2px}
.sgrp{font-size:12px;color:var(--gold3);font-weight:600;margin:12px 0 4px}
.sitem{display:flex;align-items:center;gap:10px;text-align:right;width:100%;border:none;background:none;padding:9px 10px;border-radius:10px;cursor:pointer}
.sitem:hover,.sitem:focus-visible{background:var(--hover)}
.sitem>span:last-child{display:flex;flex-direction:column;min-width:0}
.stage-row{padding:8px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.stage-row:last-child{border-bottom:none}
.stage-row.on b{color:var(--gold3)}
.mini{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);cursor:pointer;min-width:0}
.mini:last-child{border-bottom:none}
.mini>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more-link{color:var(--gold3);font-size:12.5px;font-weight:500}
/* files */
.files-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.folders{display:grid;gap:2px;position:sticky;top:16px}
.fold{display:flex;justify-content:space-between;align-items:center;gap:8px;border:none;background:none;text-align:right;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--text2)}
.fold:hover{background:var(--hover)}
.fold.on{background:var(--cur);color:var(--head);font-weight:600}
.drop{border:1.5px dashed var(--axis);border-radius:var(--r);padding:18px;text-align:center;color:var(--text2);background:var(--surface2);margin-bottom:14px;cursor:pointer}
.drop .small{color:var(--muted);margin-top:2px}
.drop.over{border-color:var(--gold);background:var(--cur)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(180px,100%),1fr));gap:12px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:6px;cursor:pointer;min-width:0;transition:transform .15s;align-content:start}
.fcard:hover{transform:translateY(-2px);border-color:var(--gold2)}
.fname{font-size:13.5px;color:var(--head);overflow-wrap:anywhere;line-height:1.5}
.fext{display:inline-grid;place-items:center;min-width:42px;height:26px;padding:0 6px;border-radius:7px;background:var(--ink2);border:1px solid var(--line);color:var(--gold2);font-size:11px;font-weight:700;letter-spacing:.04em;font-family:"Segoe UI",system-ui,sans-serif}
.fext.big{min-width:80px;height:52px;font-size:18px;border-radius:12px}
.fview{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.fprev{background:var(--surface2);border-left:1px solid var(--line);min-height:440px;display:grid;place-items:center;padding:18px;overflow:auto}
.fprev img,.fprev video{max-width:100%;max-height:68vh;border-radius:10px}
.fprev iframe{width:100%;height:68vh;border:none;border-radius:10px;background:#fff}
.fprev pre{white-space:pre-wrap;font-size:12.5px;max-height:68vh;overflow:auto;width:100%;text-align:start;align-self:start}
.fnoprev{display:grid;place-items:center;gap:10px;text-align:center}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:26px 26px 30px;width:min(420px,100%);align-self:start}
.paper h4{font-size:22px;color:var(--head);margin-top:12px;line-height:1.4}
.paper p{font-size:13px;margin:6px 0;color:var(--text2)}
.paper .ph{height:8px;border-radius:4px;background:var(--line2);margin-top:10px}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.kcol{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;min-height:180px;align-content:start}
.kcol.drag{outline:2px dashed var(--gold);outline-offset:-4px}
.kh{padding:2px 4px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:grid;gap:7px;cursor:grab;box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--gold2)}
.tcard.donec b{color:var(--muted);text-decoration:line-through}
.mv{border:1px solid var(--line);background:var(--surface2);border-radius:8px;width:32px;height:30px;cursor:pointer;font-size:15px;line-height:1}
.mv:hover{border-color:var(--gold)}
.kadd{justify-content:center;border-style:dashed;background:transparent}
/* risks */
.heat{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:5px}
.heat .lab{font-size:11.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;padding:2px 4px;line-height:1.3}
.heat .cell{border:none;border-radius:9px;min-height:54px;font-family:var(--display);font-size:22px;font-weight:700;cursor:pointer;color:var(--text)}

function coHealth(id){

  const crit = st.filter(x=>x==='crit').length, warn = st.filter(x=>x==='warn').length;
  return crit>=3 ? 'crit' : (crit+warn>=2 ? 'warn' : 'good');
}

/* ================= Charts ================= */
// Line chart; time runs right→left (RTL). series: [{name,hex,values}]
function lineChart(series, opts={}){
  const small=innerWidth<640, W=small?400:760,H=small?250:(opts.h||260),pl=8,pr=8,pt=16,pb=30, axisW=small?62:56;
  const all = series.flatMap(s=>s.values);
  let max = Math.max(...all), min = opts.zero ? 0 : Math.min(...all);
  const pad=(max-min)*0.12||1; max+=pad; min=Math.max(0,min-pad);
  const ticks=4, step=(max-min)/ticks;
  const x = i => W-pr-axisW - i*((W-pr-axisW-pl)/(MONTHS.length-1));
  const y = v => pt + (H-pt-pb) * (1-(v-min)/(max-min));
  let g='';
  for(let t=0;t<=ticks;t++){ const v=min+t*step, yy=y(v); g+=`<line x1="${pl}" x2="${W-pr-axisW+6}" y1="${yy}" y2="${yy}" stroke="${tok('--grid')}" stroke-width="1"/><text x="${W-pr}" y="${yy+4}" font-size="11" fill="${tok('--muted')}" text-anchor="end">${money(v)}</text>`; }
  MONTHS.forEach((m,i)=>{ g+=`<text x="${x(i)}" y="${H-8}" font-size="11.5" fill="${tok('--muted')}" text-anchor="middle">${m}</text>`; });
  series.forEach(s=>{
    const d=s.values.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
    g+=`<path d="${d}" fill="none" stroke="${s.hex}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li=s.values.length-1;
    g+=`<circle cx="${x(li)}" cy="${y(s.values[li])}" r="4" fill="${s.hex}" stroke="${tok('--surface')}" stroke-width="2"/>`;
  });
  const id='c'+Math.random().toString(36).slice(2,8);
  const html = `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'رسم بياني')}">${g}<line class="xh" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="${tok('--gold')}" stroke-width="1" stroke-dasharray="3 3" opacity="0"/><g class="dots"></g><rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg><div class="tip"></div></div>`;
  setTimeout(()=>{
    const el=document.getElementById(id); if(!el) return;
    const svg=el.querySelector('svg'), tip=el.querySelector('.tip'), xh=el.querySelector('.xh'), dots=el.querySelector('.dots');
    const hide=()=>{ tip.style.opacity=0; xh.setAttribute('opacity',0); dots.innerHTML=''; };
    svg.addEventListener('mouseleave',hide);
    const move=e=>{
      const r=svg.getBoundingClientRect(); const px=(e.clientX-r.left)*(W/r.width);
      let bi=0,bd=1e9; MONTHS.forEach((_,i)=>{ const dd=Math.abs(x(i)-px); if(dd<bd){bd=dd;bi=i;} });
      xh.setAttribute('x1',x(bi)); xh.setAttribute('x2',x(bi)); xh.setAttribute('opacity',1);
      dots.innerHTML=series.map(s=>`<circle cx="${x(bi)}" cy="${y(s.values[bi])}" r="5" fill="${s.hex}" stroke="${tok('--surface')}" stroke-width="2"/>`).join('');
      const rows=[...series].sort((a,b)=>b.values[bi]-a.values[bi]).map(s=>`<div class="r"><span class="row" style="gap:6px"><i class="swatch" style="background:${s.hex}"></i>${esc(s.name)}</span><span>${money(s.values[bi])}</span></div>`).join('');
      tip.innerHTML=`<b>${MONTHS[bi]} ٢٠٢٦</b>${rows}`;
      const tx=(x(bi)/W)*r.width; tip.style.opacity=1;
      tip.style.top='8px'; tip.style.left=Math.max(0,Math.min(r.width-tip.offsetWidth,(tx>r.width/2? tx-tip.offsetWidth-14 : tx+14)))+'px';
    };
    svg.addEventListener('pointermove',move); svg.addEventListener('pointerdown',move);
  });
  return html;
}
// Grouped bars: revenue vs expense per month for one company
function barPair(id){
  const f=S.fin[id], small=innerWidth<640, W=small?400:760,H=small?230:240,pt=14,pb=30,axisW=small?62:56,pl=6;
  const max=Math.max(...f.rev,...f.exp)*1.12;
  const gw=(W-axisW-pl)/MONTHS.length, bw=Math.min(22,gw/4);
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  let g='';
  for(let t=0;t<=4;t++){ const v=max*t/4, yy=y(v); g+=`<line x1="${pl}" x2="${W-axisW+6}" y1="${yy}" y2="${yy}" stroke="${tok('--grid')}"/><text x="${W}" y="${yy+4}" font-size="11" fill="${tok('--muted')}" text-anchor="end">${money(v)}</text>`; }
  const c=co(id);
  MONTHS.forEach((m,i)=>{
    const cx=W-axisW-gw*(i+0.5);
    const r1=f.rev[i], e1=f.exp[i];
    const bar=(xx,v,fill,tip)=>`<path d="M${xx} ${H-pb} V${y(v)+4} q0 -4 4 -4 h${bw-8} q4 0 4 4 V${H-pb}Z" fill="${fill}"><title>${tip}</title></path>`;
    g+=bar(cx+1,r1,c.hex,`${m}: الإيرادات ${money(r1)}`);
    g+=bar(cx-bw-1,e1,tok('--c-exp'),`${m}: المصروفات ${money(e1)}`);
    g+=`<text x="${cx}" y="${H-8}" font-size="11.5" fill="${tok('--muted')}" text-anchor="middle">${m}</text>`;
  });
  g+=`<line x1="${pl}" x2="${W-axisW+6}" y1="${H-pb}" y2="${H-pb}" stroke="${tok('--axis')}"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="الإيرادات والمصروفات الشهرية">${g}</svg></div>
  <div class="legend" style="margin-top:8px"><span><i class="swatch" style="background:${c.hex}"></i>الإيرادات</span><span><i class="swatch" style="background:var(--c-exp)"></i>المصروفات</span></div>`;
}
// Horizontal stacked bar for decision statuses
function statusBar(counts){
  const total=Object.values(counts).reduce((a,b)=>a+b,0)||1;
  const col={'مكتمل':'var(--good)','جارٍ':'var(--info)','لم يبدأ':'var(--idle)','متأخر':'var(--crit)'};
  const segs=STATUSES.filter(s=>counts[s]).map(s=>`<div title="${s}: ${n(counts[s])}" style="flex:${counts[s]};background:${col[s]};border-radius:4px"></div>`).join('');
  const leg=STATUSES.map(s=>`<span><i class="swatch" style="background:${col[s]}"></i>${s} <b>${n(counts[s]||0)}</b></span>`).join('');
  return `<div style="display:flex;gap:2px;height:14px;margin:6px 0 12px">${segs}</div><div class="legend">${leg}</div>`;
}

function companyModules(id){

window.closeModal=()=>{ $('#modal').classList.remove('open'); $('#modalBox').className='modal'; (window._urls||[]).forEach(u=>URL.revokeObjectURL(u)); window._urls=[]; };
window.saveDecision=function(id){
  const v={co:$('#f_co').value,desc:$('#f_desc').value.trim(),owner:$('#f_owner').value,due:$('#f_due').value,status:$('#f_status').value,evidence:$('#f_ev').value.trim(),reason:$('#f_reason').value.trim(),fileId:+$('#f_file').value||null};
  const err=$('#f_err'); err.style.display='block';
  if(!v.desc){ err.textContent='اكتب وصف القرار.'; return; }
  if(!v.due){ err.textContent='حدّد موعد الإنجاز.'; return; }
  if(!v.evidence && v.fileId){ v.evidence=S.files.find(f=>f.id===v.fileId).name; }
  if(v.status==='مكتمل' && !v.evidence){ err.textContent='لا يُغلق القرار إلا بدليل إنجاز — أضف المستند أو النتيجة الموثقة.'; return; }
  const was=id?S.decisions.find(x=>x.id===id).status:null;
  if(id){ Object.assign(S.decisions.find(x=>x.id===id),v); } else { id=S.nextId++; S.decisions.push({id,...v}); }
  logAct(v.status==='مكتمل'&&was!=='مكتمل' ? `أغلق القرار ${decRef(id)} بدليل «${v.evidence}»` : `${was===null?'أضاف':'حدّث'} القرار ${decRef(id)}`);
  save(); closeModal(); render(); toast('تم حفظ القرار');
};
function ask(title,msg,yes,onYes){

  $('#modal').classList.add('open'); $('#askYes').onclick=()=>{ closeModal(); onYes(); };
}

let T={running:false,start:0,elapsed:0,iv:null};
let Q={present:{chair:1,vice:1,sec:1,fin:1,clinic:1,factory:0,law:1,edu:0},co:'',fin:false,conflict:''};
function quorum(){
  const p=Object.keys(Q.present).filter(k=>Q.present[k]);
  const checks=[
    {ok:p.length>=5, t:`حضور خمسة أعضاء على الأقل (الحاضرون: ${n(p.length)})`},
    {ok:Q.present.chair||Q.present.vice, t:'حضور الرئيس أو نائبة الرئيس'},
  ];
  if(Q.co) checks.push({ok:!!Q.present[Q.co], t:`حضور ممثل ${co(Q.co).short} لأن القرار يخصها`});
  if(Q.fin) checks.push({ok:!!Q.present.fin, t:'حضور الممثل المالي لأن للقرار أثرًا ماليًا'});
  const voters=p.filter(k=>k!==Q.conflict).length;
  return {checks, ok:checks.every(c=>c.ok), voters, need:Math.floor(voters/2)+1};
}

  if(a==='toggle'){ if(T.running){T.elapsed+=(Date.now()-T.start)/1000;T.running=false;clearInterval(T.iv);} else {T.start=Date.now();T.running=true;T.iv=setInterval(()=>{ if(location.hash.startsWith('#meetings')) render(); },1000);} }
  if(a==='reset'){ T.running=false; T.elapsed=0; clearInterval(T.iv); }
  if(a==='next'){ const el=T.elapsed+(T.running?(Date.now()-T.start)/1000:0); let acc=0; for(const x of AGENDA){acc+=x.m; if(acc*60>el+0.5){ T.elapsed=acc*60; if(T.running) T.start=Date.now(); break;}} }
  render();
};

/* file bytes live in IndexedDB (the JSON state only keeps metadata); memory fallback when storage is blocked */
const MEM=new Map();
const BLOB={
  _db:null,
  open(){ if(!this._db) this._db=new Promise((res,rej)=>{ try{ const r=indexedDB.open('majlis-files',1); r.onupgradeneeded=()=>r.result.createObjectStore('blobs'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); return this._db; },
  async run(mode,fn){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction('blobs',mode); const rq=fn(tx.objectStore('blobs')); tx.oncomplete=()=>res(rq&&rq.result); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); },
  async put(id,b){ try{ await this.run('readwrite',s=>s.put(b,id)); return true; }catch(e){ MEM.set(id,b); return false; } },
  async get(id){ if(MEM.has(id)) return MEM.get(id); try{ return await this.run('readonly',s=>s.get(id)); }catch(e){ return null; } },
  async del(id){ MEM.delete(id); try{ await this.run('readwrite',s=>s.delete(id)); }catch(e){} },
  async clear(){ MEM.clear(); try{ await this.run('readwrite',s=>s.clear()); }catch(e){} },
};

function viewClients(){
  const vis=S.clients.filter(c=>inScope(c.co));
  const base=CF.co?vis.filter(c=>c.co===CF.co):vis;
  const rows=base.filter(c=>(!CF.st||c.stage===CF.st)&&(!CF.q||[clName(c),c.kind,seeConf(c)?c.contact+' '+c.notes:''].join(' ').includes(CF.q)))
    .sort((a,b)=>STAGES.indexOf(a.stage)-STAGES.indexOf(b.stage)||b.value-a.value);
  const act=base.filter(c=>c.stage==='نشط'), pipe=base.filter(c=>c.stage==='تفاوض'||c.stage==='محتمل');
  const sum=(l,k)=>l.reduce((s,c)=>s+c[k],0);
  const bal=sum(base,'bal'), b90=sum(base.filter(c=>c.age>90),'bal');
  const buckets=[['حتى ٣٠ يومًا',c=>c.age<=30,'var(--good)'],['٣١ – ٦٠ يومًا',c=>c.age>30&&c.age<=60,'var(--info)'],['٦١ – ٩٠ يومًا',c=>c.age>60&&c.age<=90,'var(--warn)'],['أكثر من ٩٠ يومًا',c=>c.age>90,'var(--crit)']].map(([l,f,col])=>({l,col,v:sum(base.filter(c=>c.bal>0&&f(c)),'bal')}));
  const bt=buckets.reduce((s,b)=>s+b.v,0)||1;

async function uploadFiles(files,p){
  if(!files.length) return;
  const MAX=25*1048576;
  if(p.replace){
    const f=S.files.find(x=>x.id===p.replace), file=files[0]; if(!f||!file) return;
    if(file.size>MAX){ toast('الملف أكبر من ٢٥ م.ب'); return; }
    const ok=await BLOB.put(f.id,file);
    (f.hist=f.hist||[]).unshift({ver:f.ver||1,date:f.date,by:f.by});
    Object.assign(f,{ver:(f.ver||1)+1,size:file.size,type:file.type||'',date:iso(today()),by:S.me,demo:false});
    logAct(`رفع النسخة ${n(f.ver)} من «${f.name}»`); save(); render(); openFile(f.id);
    toast(ok?'رُفعت النسخة الجديدة':'رُفعت النسخة مؤقتًا — التخزين الدائم غير متاح في هذا المتصفح'); return;
  }
  let count=0, mem=false;
  for(const file of files){
    if(file.size>MAX){ toast(`«${file.name}» أكبر من ٢٥ م.ب`); continue; }
    const id=uid(); if(!(await BLOB.put(id,file))) mem=true;
    S.files.unshift({id,name:file.name,size:file.size,type:file.type||'',co:p.co||FF.co||(myScope()!=='all'?myScope():'all'),folder:p.folder||FF.folder||'مستندات عامة',conf:false,tags:'',date:iso(today()),by:S.me,client:p.client||null,decision:p.decision||null,ver:1,hist:[]});
    count++;
  }
  if(!count) return;
  logAct(count===1?`رفع «${S.files[0].name}»`:`رفع ${n(count)} ملفات`); save();
  if(p.client) openClient(p.client); else if(count===1) openFile(S.files[0].id);
  render();
  toast(mem?'رُفعت الملفات مؤقتًا — التخزين الدائم غير متاح في هذا المتصفح':(count===1?'رُفع الملف':`رُفع ${n(count)} ملفات`));
}

async function previewFile(f){
  const b=await BLOB.get(f.id); const box=$('#fprev'); if(!box||box.dataset.id!=String(f.id)) return;
  if(!b){ box.innerHTML=demoPreview(f); return; }
  const url=URL.createObjectURL(b); (window._urls=window._urls||[]).push(url);
  const t=b.type||f.type||'';
  $('#fl_dl').innerHTML=`<a class="btn" href="${url}" download="${esc(f.name)}">تنزيل</a>`;
  if(t.startsWith('image/')) box.innerHTML=`<img src="${url}" alt="${esc(f.name)}">`;
  else if(t==='application/pdf') box.innerHTML=`<iframe src="${url}" title="${esc(f.name)}"></iframe>`;
  else if(t.startsWith('video/')) box.innerHTML=`<video src="${url}" controls></video>`;
  else if(t.startsWith('audio/')) box.innerHTML=`<audio src="${url}" controls></audio>`;
  else if(t.startsWith('text/')||/json|csv|xml/.test(t)||/\.(txt|csv|md|json)$/i.test(f.name)){ const txt=await b.text(); box.innerHTML=`<pre dir="auto">${esc(txt.slice(0,20000))}</pre>`; }
  else box.innerHTML=`<div class="fnoprev"><span class="fext big">${extOf(f.name)}</span><div class="muted small">لا تتوفر معاينة لهذا النوع — استخدم «تنزيل».</div></div>`;
}

let CAL=(()=>{const d=today(); return {y:d.getFullYear(),m:d.getMonth(),sel:iso(d)};})();
const DOW=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const KINDS=[['meet','الاجتماع'],['dl','مواعيد التقارير والمحاضر'],['dec','استحقاق قرار'],['late','متأخر'],['task','مهمة'],['renew','تجديد عقد'],['risk','مراجعة خطر'],['weekly','المتابعة الأسبوعية']];
window.calMove=function(d){ if(d===0){ const t=today(); CAL.y=t.getFullYear(); CAL.m=t.getMonth(); CAL.sel=iso(t); } else { CAL.m+=d; if(CAL.m<0){CAL.m=11;CAL.y--;} if(CAL.m>11){CAL.m=0;CAL.y++;} } render(); };
function viewCalendar(){
  const by={}; events().forEach(e=>(by[e.d]=by[e.d]||[]).push(e));
  const dayList=(key,d)=>{ const l=(by[key]||[]).slice(); if(d.getDay()===0) l.push({t:'المتابعة الأسبوعية',k:'weekly',go:"location.hash='tasks'"}); return l; };
  const first=new Date(CAL.y,CAL.m,1), dim=new Date(CAL.y,CAL.m+1,0).getDate(), cells=Math.ceil((first.getDay()+dim)/7)*7;
  const start=new Date(CAL.y,CAL.m,1-first.getDay()), tdy=iso(today());
  let g=DOW.map(d=>`<div class="dow"><span class="hide-sm">${d}</span><span class="show-sm">${d.replace(/^ال/,'')}</span></div>`).join('');
  for(let i=0;i<cells;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const key=iso(d), l=dayList(key,d);
    g+=`<button class="d ${d.getMonth()!==CAL.m?'out':''} ${d.getDay()>=5?'we':''} ${key===tdy?'today':''} ${key===CAL.sel?'sel':''}" onclick="CAL.sel='${key}';render()" aria-label="${fmtD(key)}${l.length?' · '+n(l.length)+' مواعيد':''}"><span class="dn">${n(d.getDate())}</span>${l.slice(0,3).map(e=>`<span class="ev k-${e.k}">${esc(e.t)}</span>`).join('')}${l.length>3?`<span class="more">+${n(l.length-3)} أخرى</span>`:''}<span class="dots">${l.slice(0,5).map(e=>`<i class="k-${e.k}"></i>`).join('')}</span></button>`; }
  const sd=parseD(CAL.sel), sl=dayList(CAL.sel,sd);
  const title=new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{month:'long',year:'numeric'}).format(first);
  return header('التقويم','الاجتماعات ومواعيد التقارير واستحقاق القرارات والمهام وتجديد العقود في مكان واحد',`<button class="btn" onclick="calMove(-1)" aria-label="الشهر السابق">→</button><button class="btn" onclick="calMove(0)">اليوم</button><button class="btn" onclick="calMove(1)" aria-label="الشهر التالي">←</button>`)
  + `<div class="grid">
      <div class="card"><h3><span class="serif" style="font-size:24px">${title}</span><small>الأسبوع يبدأ الأحد · الجمعة والسبت عطلة</small></h3><div class="cal">${g}</div>
        <div class="legend" style="margin-top:12px">${KINDS.map(([k,l])=>`<span><span class="ev k-${k}" style="padding:0 8px">${l}</span></span>`).join('')}</div></div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))">
      <div class="card"><h3>${new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{weekday:'long',day:'numeric',month:'long'}).format(sd)}</h3>
        ${sl.length?sl.map(e=>`<button class="evrow" onclick="${e.go}"><span class="ev k-${e.k}" style="max-width:none;flex:1;min-width:0;white-space:normal">${esc(e.t)}</span></button>`).join(''):'<div class="muted">لا مواعيد في هذا اليوم.</div>'}
      </div>
      <div class="card"><h3>القادم خلال ٣٠ يومًا</h3>${upcoming(30,10)}</div>
      </div>
    </div>`;
}

/* ================= Activity & settings ================= */
let AF='';
function viewActivity(){
  const list=S.log.filter(l=>!AF||l.who===AF);
  const groups=[]; list.forEach(l=>{ const k=iso(new Date(l.ts)); const g=groups[groups.length-1]; if(g&&g.k===k) g.items.push(l); else groups.push({k,items:[l]}); });
  return header('سجل النشاط','كل إجراء في المنصّة يُسجَّل باسم من قام به ووقته')
  + `<div class="filters"><select onchange="AF=this.value;render()"><option value="">كل الأعضاء</option>${MEMBERS.map(m=>`<option value="${m.key}" ${AF===m.key?'selected':''}>${m.name}</option>`).join('')}</select><span class="small muted">${n(list.length)} إجراء</span></div>
    <div class="card feed">${groups.map(g=>`<div class="dayhead">${g.k===iso(today())?'اليوم':fmtD(g.k)}</div>${feedItems(g.items)}`).join('')||'<div class="muted">لا يوجد نشاط.</div>'}</div>`;
}
function viewSettings(){
  const total=S.files.reduce((s,f)=>s+f.size,0), real=S.files.filter(f=>!f.demo).length;
  setTimeout(()=>{ try{ navigator.storage.estimate().then(e=>{ const q=$('#quota2'); if(q) q.textContent=`المستخدم ${fmtSize(e.usage||0)} من ${fmtSize(e.quota||0)} متاحة لهذا الموقع`; }); }catch(e){} });
  return header('الإعدادات','الدور الحالي والنسخ الاحتياطي والتخزين')
  + `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))">
    <div class="card"><h3>العمل بصفة</h3>
      <select style="width:100%" onchange="setRole(this.value)">${MEMBERS.map(m=>`<option value="${m.key}" ${S.me===m.key?'selected':''}>${m.name} — ${m.role}</option>`).join('')}</select>
      <div class="small muted" style="margin-top:10px;line-height:1.8">يُسجَّل كل إجراء باسم الدور المختار.<br>ممثل الشركة يرى شركته والملفات المشتركة فقط.<br>أسماء عملاء المعرفة القانونية تظهر لممثلها وحده.</div></div>
    <div class="card"><h3>النسخ الاحتياطي</h3>
      <div class="small muted" style="margin-bottom:10px">انسخ بيانات المنصّة كنص JSON لنقلها إلى جهاز آخر. لا تشمل النسخة محتوى الملفات المرفوعة.</div>
      <button class="btn primary" onclick="copyBox('نسخة احتياطية',JSON.stringify(S),'احفظ هذا النص في مكان آمن، ثم الصقه في «استعادة» على أي جهاز.')">نسخ نسخة احتياطية</button>
      <hr class="sep"><textarea id="restoreTxt" rows="3" style="width:100%" dir="ltr" placeholder="الصق نص النسخة الاحتياطية هنا"></textarea>
      <div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn" onclick="restoreIn()">استعادة</button><label class="btn" style="cursor:pointer">من ملف JSON<input type="file" accept=".json,application/json,text/plain" hidden onchange="readBackup(this)"></label></div></div>
    <div class="card"><h3>التخزين</h3>
      <div class="row between"><span>عدد الملفات</span><b>${n(S.files.length)}</b></div><div class="row between"><span>منها مرفوعة فعليًا</span><b>${n(real)}</b></div><div class="row between"><span>حجم المكتبة</span><b>${fmtSize(total)}</b></div>
      <div class="small muted" id="quota2" style="margin-top:8px"></div>
      <div class="small muted" style="margin-top:8px">تُحفظ البيانات والملفات في هذا المتصفح فقط. عند التشغيل الفعلي تنتقل إلى خادم مركزي بصلاحيات لكل مستخدم.</div></div>
    <div class="card"><h3>إعادة التعيين</h3><div class="small muted" style="margin-bottom:10px">تُعاد البيانات التجريبية وتُحذف الملفات المرفوعة من هذا المتصفح.</div><button class="btn" style="color:var(--crit)" onclick="resetAll()">إعادة تعيين كل البيانات</button>
      <hr class="sep"><div class="small muted">منصّة المجلس · الإصدار ٢٫٠ · صُمّمت وطُوّرت بواسطة روّاد</div></div>
  </div>`;
}
window.readBackup=function(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ $('#restoreTxt').value=r.result; restoreIn(); }; r.readAsText(f); };
window.restoreIn=function(){
  let o; try{ o=JSON.parse($('#restoreTxt').value.trim()); }catch(e){ o=null; }
  if(!o||!o.decisions||!o.fin){ toast('النص ليس نسخة احتياطية صالحة'); return; }
  ask('استعادة النسخة','ستحل بيانات النسخة محل البيانات الحالية في هذا المتصفح.','استعادة',()=>{ S=Object.assign(seed(),o); logAct('استعاد نسخة احتياطية'); save(); render(); toast('تمت الاستعادة'); });
};
window.resetAll=function(){ ask('إعادة تعيين البيانات','ستعود جميع البيانات التجريبية في هذا المتصفح إلى حالتها الأصلية، وتُحذف تعديلاتك والملفات المرفوعة.','إعادة التعيين',async()=>{ await BLOB.clear(); S=seed(); save(); render(); toast('أُعيدت البيانات التجريبية'); }); };

/* ================= Router ================= */
function render(){
  const route=(location.hash||'#dashboard').slice(1);
  renderNav(route); renderTabbar(route);
  const p=route.startsWith('company-')?'company':route, arg=route.slice(8);
  const v={dashboard:viewDashboard,company:()=>viewCompany(arg),decisions:viewDecisions,meetings:viewMeetings,authority:viewAuthority,plan:viewPlan,members:viewMembers,clients:viewClients,files:viewFiles,tasks:viewTasks,calendar:viewCalendar,risks:viewRisks,activity:viewActivity,settings:viewSettings}[p]||viewDashboard;
  const y=window.scrollY; $('#main').innerHTML=v()+`<footer class="credit"><span class="credit-mark"></span>صُمّم وطُوّر بواسطة <a href="https://wa.me/966570091554?text=%D9%85%D8%B1%D8%AD%D8%A8%D9%8B%D8%A7%20%D8%B1%D9%88%D9%91%D8%A7%D8%AF%D8%8C%20%D8%B4%D8%A7%D9%87%D8%AF%D8%AA%20%D9%85%D9%86%D8%B5%D9%91%D8%A9%20%D8%A7%D9%84%D9%85%D8%AC%D9%84%D8%B3%20%D9%88%D8%A3%D8%B1%D8%BA%D8%A8%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%AA%D9%88%D8%A7%D8%B5%D9%84" target="_blank" rel="noopener" title="تواصل مع روّاد عبر واتساب">روّاد</a></footer>`; if(render._last===route) window.scrollTo(0,y); else window.scrollTo(0,0);
  render._last=route;
  toggleMenu(false);
}
window.addEventListener('hashchange',render);
let _w=innerWidth; window.addEventListener('resize',()=>{ if((innerWidth<640)!==(_w<640)){ _w=innerWidth; render(); } });
$('#scrim').addEventListener('click',()=>toggleMenu(false));
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render); }catch(e){}
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); } });
$('#reset').addEventListener('click',e=>{ e.preventDefault(); resetAll(); });
render();
</script>
