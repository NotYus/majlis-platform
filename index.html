<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1626">
<meta name="author" content="روّاد">
<title>منصّة المجلس</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>document.documentElement.dir='rtl';document.documentElement.lang='ar';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: dark navy rail (sidebar on desktop, bottom tabs on phones) beside an ivory working surface; gold marks the council, four fixed hues mark the companies. */
  --head:#0B1626; --ink:#0B1626; --ink2:#13233A; --navy:#1B2F4B;
  --bg:#F6F2EA; --surface:#FFFFFF; --surface2:#FBF8F2; --line:#E7DECD; --line2:#F0EADF;
  --gold:#B8925A; --gold2:#D9BC84; --gold3:#8A6A3B;
  --text:#1D2633; --text2:#4A5463; --muted:#7A8392;
  /* categorical — fixed order, validated (light) */
  --c-clinic:#1F5FA8; --c-factory:#C08A2E; --c-law:#8E4BB0; --c-edu:#119C84; --c-exp:#B9C1CC;
  --grid:#EFE8DA; --axis:#CFC5B3; --hover:#FCFAF5; --scrim:rgba(8,17,30,.5); --cur:#F6EDD9;
  /* status — reserved */
  --good:#2F7D4F; --good-bg:#E3F1E8; --warn:#9A6A12; --warn-bg:#FBEFD6; --crit:#B23A2E; --crit-bg:#F8E2DF; --idle:#5B6574; --idle-bg:#ECEFF3; --info:#2D5B9A; --info-bg:#E5ECF6;
  --r:14px; --shadow:0 1px 2px rgba(11,22,38,.04),0 8px 24px rgba(11,22,38,.05);
  --display:"Amiri",Georgia,serif; --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --head:#F1E9DA; --bg:#0A111C; --surface:#121B29; --surface2:#172234; --line:#263449; --line2:#1C2838;
  --gold:#C9A465; --gold3:#D9BC84; --text:#E6E1D7; --text2:#B9C1CD; --muted:#8D97A6;
  --c-clinic:#5B8FD6; --c-factory:#B98222; --c-law:#A779CC; --c-edu:#14967E; --c-exp:#4A5668;
  --grid:#1E2A3B; --axis:#33435A; --hover:#162131; --scrim:rgba(0,0,0,.6); --cur:#2A2617;
  --good:#7CCB98; --good-bg:#16301F; --warn:#E3B45A; --warn-bg:#33270F; --crit:#F08A7E; --crit-bg:#3A1A17; --idle:#A9B3C1; --idle-bg:#222D3C; --info:#8DB4EA; --info-bg:#172A45;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --head:#F1E9DA; --bg:#0A111C; --surface:#121B29; --surface2:#172234; --line:#263449; --line2:#1C2838;
  --gold:#C9A465; --gold3:#D9BC84; --text:#E6E1D7; --text2:#B9C1CD; --muted:#8D97A6;
  --c-clinic:#5B8FD6; --c-factory:#B98222; --c-law:#A779CC; --c-edu:#14967E; --c-exp:#4A5668;
  --grid:#1E2A3B; --axis:#33435A; --hover:#162131; --scrim:rgba(0,0,0,.6); --cur:#2A2617;
  --good:#7CCB98; --good-bg:#16301F; --warn:#E3B45A; --warn-bg:#33270F; --crit:#F08A7E; --crit-bg:#3A1A17; --idle:#A9B3C1; --idle-bg:#222D3C; --info:#8DB4EA; --info-bg:#172A45;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
.serif{font-family:var(--display)}
a{color:inherit;text-decoration:none}

/* layout */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:radial-gradient(140% 80% at 50% 0%,#18304F 0%,var(--ink) 65%);color:#E9E2D3;padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;border-bottom:1px solid rgba(217,188,132,.18)}
.brand b{font-family:var(--display);font-size:21px;color:var(--gold2);display:block;line-height:1.2}
.brand span{font-size:11.5px;color:#9AA6B8}
nav{margin-top:18px;display:flex;flex-direction:column;gap:2px}
nav .grp{font-size:11px;color:#7F8CA0;margin:16px 10px 6px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:#CBD3DF;font-size:14px}
nav a:hover{background:rgba(255,255,255,.05)}
nav a.on{background:linear-gradient(270deg,rgba(217,188,132,.18),rgba(217,188,132,.04));color:#F4E6C6;box-shadow:inset -3px 0 0 var(--gold)}
nav a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav .dot{width:9px;height:9px;border-radius:3px;flex:none}
nav .badge{margin-right:auto;background:var(--crit);color:#fff;font-size:11px;border-radius:10px;padding:0 7px}
.aside-foot{margin-top:auto;font-size:11px;color:#7F8CA0;padding:10px;border-top:1px solid rgba(217,188,132,.18)}
main{padding-block:28px 60px;padding-left:max(36px, env(safe-area-inset-left, 0px));padding-right:36px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-size:34px;line-height:1.2;color:var(--head)}
.top .sub{color:var(--muted);font-size:13px}
.demo{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:20px;padding:3px 12px}

/* primitives */
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:15px;font-weight:600;color:var(--head);display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:12px}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px}
.tile .lbl{font-size:12.5px;color:var(--muted)}
.tile .val{font-family:var(--display);font-size:34px;font-weight:700;color:var(--head);line-height:1.25;margin-top:4px}
.tile .delta{font-size:12px;margin-top:2px}
.up{color:var(--good)}.down{color:var(--crit)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;cursor:pointer;font-size:13.5px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--ink);color:#F4E6C6;border-color:var(--gold3)}
.btn.primary:hover{background:var(--navy)}
.btn.gold{background:linear-gradient(180deg,#E3C68E,#B8925A);border-color:#B8925A;color:#0B1626;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:20px;padding:2px 10px;white-space:nowrap}
.pill svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.s-good{background:var(--good-bg);color:var(--good)}.s-warn{background:var(--warn-bg);color:var(--warn)}.s-crit{background:var(--crit-bg);color:var(--crit)}.s-idle{background:var(--idle-bg);color:var(--idle)}.s-info{background:var(--info-bg);color:var(--info)}
.swatch{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.muted{color:var(--muted)} .small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
hr.sep{border:none;border-top:1px solid var(--line2);margin:12px 0}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,input[type=text],input[type=date],input[type=search],textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;min-width:0}
select:focus,input:focus,textarea:focus{outline:2px solid var(--gold2);outline-offset:0}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:none;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2)}
.seg button.on{background:var(--ink);color:#F4E6C6}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.split{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.split2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.dec-cards{display:none}
.tabbar,.scrim{display:none}
.credit{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--muted)}
.credit b{color:var(--gold3);font-weight:600}
.credit-mark{width:8px;height:8px;transform:rotate(45deg);border:1.5px solid var(--gold)}
.tile .val,td{font-variant-numeric:tabular-nums}

/* company cards */
.co{position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.co:hover{transform:translateY(-2px)}
.co .bar{position:absolute;top:0;right:0;left:0;height:4px}
.co .name{font-weight:700;font-size:15px;color:var(--head)}
.co .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px}
.co .kv div span{display:block;font-size:11.5px;color:var(--muted)}
.co .kv div b{font-size:16px;color:var(--head)}
.meter{height:6px;border-radius:4px;background:var(--line2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:4px}

/* tables */
table{width:100%;border-collapse:separate;border-spacing:0}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);position:sticky;top:0}
td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#F1E9DA;border-radius:10px;padding:8px 12px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5}
.tip b{color:var(--gold2);display:block;margin-bottom:3px}
.tip .r{display:flex;align-items:center;gap:7px;justify-content:space-between}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* modal */
.modal-bg{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:18px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header h2{font-family:var(--display);font-size:24px}
.modal .body{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal .full{grid-column:1/-1}
.modal label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--text2);font-weight:500}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start}
.err{color:var(--crit);font-size:12.5px;grid-column:1/-1;display:none}
.x{border:none;background:none;font-size:22px;cursor:pointer;color:var(--muted)}

/* misc components */
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end}
.lvl{border:1px solid var(--line);border-bottom:4px solid var(--gold);border-radius:12px 12px 0 0;padding:12px;background:var(--surface);display:flex;flex-direction:column;cursor:pointer}
.lvl.on{background:var(--ink);color:#F1E6CF;border-color:var(--gold3)}
.lvl.on b{color:#F1E6CF}
.lvl.on .muted{color:#AEB8C7}
.lvl .n{font-family:var(--display);font-size:26px;color:var(--gold);line-height:1}
.agenda .it{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.agenda .it .m{font-family:var(--display);font-size:22px;color:var(--gold3);text-align:center}
.agenda .it.cur{background:linear-gradient(270deg,var(--cur),transparent);border-radius:10px}
.timer{font-family:var(--display);font-size:46px;color:var(--head);line-height:1}
.member{display:flex;gap:14px;align-items:flex-start}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;flex:none;background:var(--ink);color:var(--gold2)}
.check{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.check input{margin-top:5px;accent-color:var(--ink);width:16px;height:16px}
.check.done span{color:var(--muted);text-decoration:line-through}
.phase-head{display:flex;align-items:center;gap:12px}
.phase-num{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--gold2);display:grid;place-items:center;font-family:var(--display);font-size:19px;border:2px solid var(--gold)}
.kpi{padding:14px 0;border-bottom:1px solid var(--line2)}
.kpi:last-child{border-bottom:none}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom, 0px));left:calc(24px + env(safe-area-inset-left, 0px));background:var(--ink);color:#F1E6CF;padding:10px 18px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.2s;z-index:60}
.toast.show{opacity:1;transform:none}
.hamb{display:none}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 0 0 auto;width:min(290px,86vw);z-index:40;transform:translateX(105%);transition:transform .2s;padding-top:calc(24px + env(safe-area-inset-top, 0px));padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));height:100%;overflow:auto}
  aside.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:39;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.open{opacity:1;pointer-events:auto}
  main{padding-block:16px calc(96px + env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .split,.split2{grid-template-columns:minmax(0,1fr)}
  .ladder{grid-template-columns:repeat(3,1fr)}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--ink);border-top:1px solid rgba(217,188,132,.25);padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;color:#AEB8C7;font-size:11px;background:none;border:none;cursor:pointer;position:relative}
  .tabbar a.on{color:#F4E6C6}
  .tabbar a.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:#D9BC84}
  .tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .tabbar .badge{position:absolute;top:6px;margin-right:-26px;background:#B23A2E;color:#fff;font-size:10px;border-radius:9px;padding:0 5px;line-height:16px}
}
@media (max-width:640px){
  .top{margin-bottom:14px}
  .top h1{font-size:27px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{padding:14px}
  .tile .val{font-size:25px}
  .card{padding:15px 14px}
  .co .kv{gap:8px 10px}
  .ladder{grid-template-columns:repeat(2,1fr)}
  .ladder .lvl{height:auto!important;min-height:120px}
  .tbl-wrap{display:none}
  .dec-cards{display:grid;gap:10px}
  .dec-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;cursor:pointer}
  .dec-card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
  .filters{gap:8px}
  .filters select,.filters input{flex:1 1 100%}
  .seg{overflow-x:auto;max-width:100%}
  .q-grid{grid-template-columns:1fr!important}
  .modal-bg{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:94vh;padding-bottom:env(safe-area-inset-bottom, 0px)}
  .modal .body{grid-template-columns:1fr}
  .timer{font-size:36px}
  .card h3{flex-wrap:wrap}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="app">
  <aside id="aside">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 100 100"><g fill="none" stroke="#D9BC84" stroke-width="3"><rect x="22" y="22" width="56" height="56"/><rect x="22" y="22" width="56" height="56" transform="rotate(45 50 50)"/><circle cx="50" cy="50" r="15"/></g></svg>
      <div><b>منصّة المجلس</b><span>المجلس الإشرافي المشترك</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="aside-foot"><div style="color:#D9BC84;font-weight:600;margin-bottom:6px">صُمّم وطُوّر بواسطة روّاد</div>نموذج أولي للعرض · البيانات تجريبية وتُحفظ في هذا المتصفح<br><a href="#" id="reset" style="color:#D9BC84">إعادة تعيين البيانات</a></div>
  </aside>
  <main id="main"></main>
</div>
<div class="scrim" id="scrim"></div>
<nav class="tabbar" id="tabbar" aria-label="التنقل السريع"></nav>

<div class="modal-bg" id="modal"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= Data ================= */
const tok = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const COMPANIES = [
  {id:'clinic', name:'عيادات النجوم السبعة الطبية', short:'النجوم السبعة', color:'var(--c-clinic)', get hex(){return tok('--c-clinic');}},
  {id:'factory',name:'شركة العلامة الكبرى للصناعات الخشبية', short:'العلامة الكبرى', color:'var(--c-factory)', get hex(){return tok('--c-factory');}},
  {id:'law',    name:'شركة المعرفة القانونية للمحاماة', short:'المعرفة القانونية', color:'var(--c-law)', get hex(){return tok('--c-law');}},
  {id:'edu',    name:'شركة نوليدج للتعليم', short:'نوليدج', color:'var(--c-edu)', get hex(){return tok('--c-edu');}},
];
const MONTHS = ['يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر'];
const STATUSES = ['لم يبدأ','جارٍ','مكتمل','متأخر'];
const MEMBERS = [
  {name:'الدكتور خالد العيسى', role:'رئيس المجلس', resp:'إقرار جدول الأعمال، وترؤس الاجتماعات، وتوجيه الأولويات، واعتماد مخرجات المجلس ضمن صلاحياته.', key:'chair'},
  {name:'الأستاذة رهف خالد العيسى', role:'نائبة رئيس المجلس', resp:'ترؤس الاجتماعات عند تفويضها، ومتابعة الملفات المكلّفة بها، ومراجعة تقدم المبادرات.', key:'vice'},

// Line chart; time runs right→left (RTL). series: [{name,hex,values}]
function lineChart(series, opts={}){
  const small=innerWidth<640, W=small?400:760,H=small?250:(opts.h||260),pl=8,pr=8,pt=16,pb=30, axisW=small?62:56;
  const all = series.flatMap(s=>s.values);
  let max = Math.max(...all), min = opts.zero ? 0 : Math.min(...all);
  const pad=(max-min)*0.12||1; max+=pad; min=Math.max(0,min-pad);
  const ticks=4, step=(max-min)/ticks;
  const x = i => W-pr-axisW - i*((W-pr-axisW-pl)/(MONTHS.length-1));
  const y = v => pt + (H-pt-pb) * (1-(v-min)/(max-min));
  let g='';
  for(let t=0;t<=ticks;t++){ const v=min+t*step, yy=y(v); g+=`<line x1="${pl}" x2="${W-pr-axisW+6}" y1="${yy}" y2="${yy}" stroke="${tok('--grid')}" stroke-width="1"/><text x="${W-pr}" y="${yy+4}" font-size="11" fill="${tok('--muted')}" text-anchor="end">${money(v)}</text>`; }
  MONTHS.forEach((m,i)=>{ g+=`<text x="${x(i)}" y="${H-8}" font-size="11.5" fill="${tok('--muted')}" text-anchor="middle">${m}</text>`; });
  series.forEach(s=>{
    const d=s.values.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
    g+=`<path d="${d}" fill="none" stroke="${s.hex}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li=s.values.length-1;
    g+=`<circle cx="${x(li)}" cy="${y(s.values[li])}" r="4" fill="${s.hex}" stroke="${tok('--surface')}" stroke-width="2"/>`;
  });
  const id='c'+Math.random().toString(36).slice(2,8);
  const html = `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'رسم بياني')}">${g}<line class="xh" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="${tok('--gold')}" stroke-width="1" stroke-dasharray="3 3" opacity="0"/><g class="dots"></g><rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg><div class="tip"></div></div>`;
  setTimeout(()=>{
    const el=document.getElementById(id); if(!el) return;
    const svg=el.querySelector('svg'), tip=el.querySelector('.tip'), xh=el.querySelector('.xh'), dots=el.querySelector('.dots');
    const hide=()=>{ tip.style.opacity=0; xh.setAttribute('opacity',0); dots.innerHTML=''; };
    svg.addEventListener('mouseleave',hide);
    const move=e=>{
      const r=svg.getBoundingClientRect(); const px=(e.clientX-r.left)*(W/r.width);
      let bi=0,bd=1e9; MONTHS.forEach((_,i)=>{ const dd=Math.abs(x(i)-px); if(dd<bd){bd=dd;bi=i;} });
      xh.setAttribute('x1',x(bi)); xh.setAttribute('x2',x(bi)); xh.setAttribute('opacity',1);
      dots.innerHTML=series.map(s=>`<circle cx="${x(bi)}" cy="${y(s.values[bi])}" r="5" fill="${s.hex}" stroke="${tok('--surface')}" stroke-width="2"/>`).join('');
      const rows=[...series].sort((a,b)=>b.values[bi]-a.values[bi]).map(s=>`<div class="r"><span class="row" style="gap:6px"><i class="swatch" style="background:${s.hex}"></i>${esc(s.name)}</span><span>${money(s.values[bi])}</span></div>`).join('');
      tip.innerHTML=`<b>${MONTHS[bi]} ٢٠٢٦</b>${rows}`;
      const tx=(x(bi)/W)*r.width; tip.style.opacity=1;
      tip.style.top='8px'; tip.style.left=Math.max(0,Math.min(r.width-tip.offsetWidth,(tx>r.width/2? tx-tip.offsetWidth-14 : tx+14)))+'px';
    };
    svg.addEventListener('pointermove',move); svg.addEventListener('pointerdown',move);
  });
  return html;
}

function barPair(id){

  const y=v=>pt+(H-pt-pb)*(1-v/max);
  let g='';
  for(let t=0;t<=4;t++){ const v=max*t/4, yy=y(v); g+=`<line x1="${pl}" x2="${W-axisW+6}" y1="${yy}" y2="${yy}" stroke="${tok('--grid')}"/><text x="${W}" y="${yy+4}" font-size="11" fill="${tok('--muted')}" text-anchor="end">${money(v)}</text>`; }
  const c=co(id);
  MONTHS.forEach((m,i)=>{

    const bar=(xx,v,fill,tip)=>`<path d="M${xx} ${H-pb} V${y(v)+4} q0 -4 4 -4 h${bw-8} q4 0 4 4 V${H-pb}Z" fill="${fill}"><title>${tip}</title></path>`;
    g+=bar(cx+1,r1,c.hex,`${m}: الإيرادات ${money(r1)}`);

    g+=`<text x="${cx}" y="${H-8}" font-size="11.5" fill="${tok('--muted')}" text-anchor="middle">${m}</text>`;
  });
  g+=`<line x1="${pl}" x2="${W-axisW+6}" y1="${H-pb}" y2="${H-pb}" stroke="${tok('--axis')}"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="الإيرادات والمصروفات الشهرية">${g}</svg></div>
  <div class="legend" style="margin-top:8px"><span><i class="swatch" style="background:${c.hex}"></i>الإيرادات</span><span><i class="swatch" style="background:var(--c-exp)"></i>المصروفات</span></div>`;
}

let T={running:false,start:0,elapsed:0,iv:null};
let Q={present:{chair:1,vice:1,sec:1,fin:1,clinic:1,factory:0,law:1,edu:0},co:'',fin:false,conflict:''};
function quorum(){
  const p=Object.keys(Q.present).filter(k=>Q.present[k]);
  const checks=[
    {ok:p.length>=5, t:`حضور خمسة أعضاء على الأقل (الحاضرون: ${n(p.length)})`},
    {ok:Q.present.chair||Q.present.vice, t:'حضور الرئيس أو نائبة الرئيس'},
  ];
  if(Q.co) checks.push({ok:!!Q.present[Q.co], t:`حضور ممثل ${co(Q.co).short} لأن القرار يخصها`});
  if(Q.fin) checks.push({ok:!!Q.present.fin, t:'حضور الممثل المالي لأن للقرار أثرًا ماليًا'});
  const voters=p.filter(k=>k!==Q.conflict).length;
  return {checks, ok:checks.every(c=>c.ok), voters, need:Math.floor(voters/2)+1};
}

      <div class="row" style="flex-wrap:wrap"><input type="date" value="${S.meeting.date}" onchange="S.meeting.date=this.value;save();render()"><input type="text" value="${esc(S.meeting.time)}" style="width:90px" onchange="S.meeting.time=this.value;save()"></div>
      <hr class="sep">
      <div class="row between"><span>آخر موعد لاستلام التقارير</span><b>${fmtD(iso(addBiz(md,-3)))}</b></div>
      <div class="small muted">قبل الاجتماع بثلاثة أيام عمل</div>
      <div class="row between" style="margin-top:8px"><span>آخر موعد لتعميم المحضر</span><b>${fmtD(iso(addBiz(md,2)))}</b></div>
      <div class="small muted">خلال يومي عمل بعد الاجتماع</div>
      <hr class="sep">
      <div class="small"><b>الإيقاع:</b> متابعة أسبوعية يديرها أمين المجلس · اجتماع شهري · مراجعة ربع سنوية · اجتماع استثنائي بطلب الرئيس أو نائبته.</div>
    </div>
    <div class="card"><h3>مدقّق النصاب والتصويت</h3>
      <div class="grid q-grid" style="grid-template-columns:1fr 1fr;gap:4px 12px">
        ${MEMBERS.map(m=>`<label class="row small" style="cursor:pointer"><input type="checkbox" ${Q.present[m.key]?'checked':''} onchange="Q.present['${m.key}']=this.checked?1:0;render()" style="accent-color:var(--ink)">${m.name.replace('الدكتور ','د. ').replace('الأستاذة ','أ. ')}</label>`).join('')}
      </div>
      <hr class="sep">
      <div class="row" style="flex-wrap:wrap">
        <select onchange="Q.co=this.value;render()"><option value="">القرار لا يخص شركة بعينها</option>${COMPANIES.map(c=>`<option value="${c.id}" ${Q.co===c.id?'selected':''}>يخص ${c.short}</option>`).join('')}</select>
        <label class="row small"><input type="checkbox" ${Q.fin?'checked':''} onchange="Q.fin=this.checked;render()">له أثر مالي</label>
      </div>
      <select style="margin-top:8px;width:100%" onchange="Q.conflict=this.value;render()"><option value="">لا يوجد تعارض مصالح</option>${MEMBERS.map(m=>`<option value="${m.key}" ${Q.conflict===m.key?'selected':''}>تعارض مصالح: ${m.name}</option>`).join('')}</select>
      <div style="margin-top:12px">${q.checks.map(c=>`<div class="row small" style="padding:3px 0">${c.ok?stPill('good').replace('على المسار','متحقق'):stPill('crit').replace('متعثر','غير متحقق')}<span>${c.t}</span></div>`).join('')}</div>
      <div class="card" style="margin-top:10px;background:${q.ok?'var(--good-bg)':'var(--crit-bg)'};border:none;box-shadow:none;padding:12px 14px">
        <b>${q.ok?'النصاب مكتمل — يمكن اتخاذ القرار':'النصاب غير مكتمل — لا يُتخذ القرار'}</b>
        <div class="small">يحق التصويت لـ ${n(q.voters)} عضوًا${Q.conflict?' (بعد امتناع صاحب المصلحة، ويُثبت في المحضر)':''} · الأغلبية المطلوبة ${n(q.need)} · عند التعادل يرجّح جانب رئيس الجلسة</div>
      </div>
    </div>
  </div>
  <div class="card" style="margin-top:16px"><h3>جدول الاجتماع ومؤقّت التسعين دقيقة <span class="row"><button class="btn gold" onclick="timer('toggle')">${T.running?'إيقاف مؤقت':'بدء'}</button><button class="btn" onclick="timer('next')">البند التالي</button><button class="btn" onclick="timer('reset')">إعادة</button></span></h3>
    <div class="row" style="gap:18px;align-items:center;margin-bottom:6px"><div class="timer" id="timer">${n(mm)}:${n(String(ss).padStart(2,'0')).replace(/٬/g,'')}</div><div style="flex:1"><div class="meter" style="height:10px"><i id="tbar" style="width:${Math.min(100,el/totalSec*100)}%;background:var(--gold)"></i></div><div class="small muted" style="margin-top:4px">من أصل ${n(90)} دقيقة</div></div></div>
    <div class="agenda">${(()=>{let a=0;return AGENDA.map((x,i)=>{const s=a;a+=x.m;return `<div class="it ${i===cur?'cur':''}"><div class="m">${n(x.m)}</div><div><b>${x.t}</b><div class="small muted">الدقيقة ${n(s)} – ${n(a)}</div></div><div>${el>=a*60?stPill('good').replace('على المسار','تم'):(i===cur?'<span class="pill s-info">جارٍ</span>':'')}</div></div>`;}).join('');})()}</div>
  </div>`;
}
window.timer=function(a){
  if(a==='toggle'){ if(T.running){T.elapsed+=(Date.now()-T.start)/1000;T.running=false;clearInterval(T.iv);} else {T.start=Date.now();T.running=true;T.iv=setInterval(()=>{ if(location.hash.startsWith('#meetings')) render(); },1000);} }
  if(a==='reset'){ T.running=false; T.elapsed=0; clearInterval(T.iv); }
  if(a==='next'){ const el=T.elapsed+(T.running?(Date.now()-T.start)/1000:0); let acc=0; for(const x of AGENDA){acc+=x.m; if(acc*60>el+0.5){ T.elapsed=acc*60; if(T.running) T.start=Date.now(); break;}} }
  render();
};

let LV=0;
function viewAuthority(){
  const l=LEVELS[LV];
  return header('مستويات الصلاحيات','لكل قرار مكانه — اختر نوع الطلب لمعرفة مساره')
  + `<div class="card"><div class="ladder">${LEVELS.map((x,i)=>`<div class="lvl ${i===LV?'on':''}" style="height:${150+i*34}px" onclick="LV=${i};render()"><div class="n">${n(i+1)}</div><b style="font-size:13.5px;margin-top:6px;line-height:1.5">${x.t}</b><span class="small muted" style="margin-top:auto">${x.by}</span></div>`).join('')}</div></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));margin-top:16px">
    <div class="card"><h3>نوع الطلب</h3><select style="width:100%" onchange="LV=+this.value;render()">${LEVELS.map((x,i)=>`<option value="${i}" ${i===LV?'selected':''}>${n(i+1)} — ${x.t}</option>`).join('')}</select>
      <div class="card" style="margin-top:12px;background:var(--ink);color:#F1E6CF;border:none"><div class="small" style="color:var(--gold2)">المسار</div><div class="serif" style="font-size:24px;margin-top:4px">${l.by}</div><div style="margin-top:6px;color:#C9D1DD">${l.who}</div></div>
    </div>
    <div class="card"><h3>مبادئ ثابتة</h3>
      <div class="kpi">لا يحل المجلس محل مدير الشركة في إدارة العمل اليومي، وتصدر التوجيهات للموظفين عبر مديرهم المسؤول.</div>
      <div class="kpi">تُعد مصفوفة الصلاحيات المالية والإدارية (الحدود المالية وأسماء أصحاب الاعتماد) خلال أول ثلاثين يومًا. <span class="pill s-warn">قيد الإعداد</span></div>
      <div class="kpi">حتى اعتمادها تستمر الصلاحيات القائمة، وتكون مخرجات المجلس فيما يتجاوز التفويض توصيات مرفوعة للاعتماد.</div>
      <div class="kpi">لا يمنح التصويت صلاحية تتجاوز التفويض المعتمد للمجلس.</div>
    </div>
  </div>`;
}

function viewPlan(){
  const start=parseD(S.planStart); const day=Math.max(1,Math.min(90,Math.floor((today()-start)/864e5)+1));
  const all=S.plan.flatMap(p=>p.tasks), done=all.filter(t=>t[1]).length;
  return header('خطة التأسيس خلال ٩٠ يومًا','من التسمية إلى التقييم')
  + `<div class="grid tiles">
      <div class="card tile"><div class="lbl">اليوم الحالي من الخطة</div><div class="val">${n(day)} <span class="small muted">/ ${n(90)}</span></div><div class="meter"><i style="width:${day/90*100}%;background:var(--gold)"></i></div></div>
      <div class="card tile"><div class="lbl">المهام المنجزة</div><div class="val">${n(done)} <span class="small muted">/ ${n(all.length)}</span></div><div class="meter"><i style="width:${done/all.length*100}%;background:var(--ink)"></i></div></div>
      <div class="card tile"><div class="lbl">تاريخ البدء</div><input type="date" value="${S.planStart}" style="margin-top:8px" onchange="S.planStart=this.value;save();render()"></div>
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));margin-top:16px">
    ${S.plan.map((p,pi)=>{const dn=p.tasks.filter(t=>t[1]).length; const active=day>=p.d[0]&&day<=p.d[1]; const st=dn===p.tasks.length?'good':(day>p.d[1]?'crit':(active?'warn':null));
      return `<div class="card" style="${active?'border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,188,132,.25)':''}">
        <div class="phase-head"><div class="phase-num">${n(pi+1)}</div><div><div class="small muted">الأيام ${n(p.d[0])} – ${n(p.d[1])}</div><b style="font-size:16px">${p.t}</b></div></div>
        <div style="margin:10px 0">${st?stPill(st).replace('على المسار','مكتملة').replace('متعثر','متأخرة').replace('يحتاج متابعة','جارية'):'<span class="pill s-idle">لم تبدأ</span>'}</div>
        ${p.tasks.map((t,ti)=>`<label class="check ${t[1]?'done':''}"><input type="checkbox" ${t[1]?'checked':''} onchange="S.plan[${pi}].tasks[${ti}][1]=this.checked?1:0;save();render()"><span>${t[0]}</span></label>`).join('')}
        <div class="small" style="margin-top:10px"><span class="muted">المخرجات:</span> <b>${p.out}</b></div></div>`;}).join('')}
    </div>`;
}

function viewMembers(){
  return header('أعضاء المجلس','ثمانية أعضاء · لكل عضو مسؤولية واضحة')
  + `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))">${MEMBERS.map((m,i)=>{const c=co(m.key);
    return `<div class="card member"><div class="avatar" style="${i===0?'background:linear-gradient(180deg,#E3C68E,#B8925A);color:#0B1626':''}${c?`;background:${c.hex};color:#fff`:''}">${m.name.replace(/^(الدكتور|الأستاذة|ممثل|الممثل)\s*/,'').trim()[0]}</div>
      <div><b style="font-size:15px">${m.name}</b><div class="small" style="color:var(--gold3)">${m.role}</div><div class="small muted" style="margin-top:6px">${m.resp}</div>
      <div class="small" style="margin-top:8px">قرارات مسندة: <b>${n(S.decisions.filter(d=>d.owner===m.name&&effStatus(d)!=='مكتمل').length)}</b> مفتوحة</div></div></div>`;}).join('')}</div>
    <p class="small muted" style="margin-top:14px">يُفضّل أن يكون ممثل كل شركة مديرها التنفيذي أو المسؤول الأول عن تشغيلها، مع صلاحية تنفيذية واضحة داخل شركته.</p>`;
}

/* ================= Router ================= */
function render(){
  const route=(location.hash||'#dashboard').slice(1);
  renderNav(route); renderTabbar(route);
  const p=route.startsWith('company-')?'company':route, arg=route.slice(8);
  const v={dashboard:viewDashboard,company:()=>viewCompany(arg),decisions:viewDecisions,meetings:viewMeetings,authority:viewAuthority,plan:viewPlan,members:viewMembers}[p]||viewDashboard;
  const y=window.scrollY; $('#main').innerHTML=v()+`<footer class="credit"><span class="credit-mark"></span>صُمّم وطُوّر بواسطة <b>روّاد</b></footer>`; if(render._last===route) window.scrollTo(0,y); else window.scrollTo(0,0);
  render._last=route;
  toggleMenu(false);
}
window.addEventListener('hashchange',render);
let _w=innerWidth; window.addEventListener('resize',()=>{ if((innerWidth<640)!==(_w<640)){ _w=innerWidth; render(); } });
$('#scrim').addEventListener('click',()=>toggleMenu(false));
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render); }catch(e){}
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
$('#reset').addEventListener('click',e=>{ e.preventDefault(); ask('إعادة تعيين البيانات','ستعود جميع البيانات التجريبية في هذا المتصفح إلى حالتها الأصلية، وتُحذف تعديلاتك.','إعادة التعيين',()=>{ S=seed(); save(); render(); toast('أُعيدت البيانات التجريبية'); }); });
render();
</script>


</body>
</html>
